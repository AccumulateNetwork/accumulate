linters-settings:
  custom:
    noprint:
      type: module
    nodebug:
      type: module
    rangevarref:
      type: module

  goheader:
    values:
      const:
        AUTHOR: The Accumulate Authors
      regexp:
        # Any 4-digit year. {{ YEAR }} expands to the CURRENT year, so every file
        # carrying an older copyright failed the moment the calendar rolled over
        # — ~60 findings on 1 January with no code change. A file written in 2025
        # correctly says 2025.
        ANYYEAR: 20\d\d
    template: |-
      Copyright {{ ANYYEAR }} {{ AUTHOR }}

      Use of this source code is governed by an MIT-style
      license that can be found in the LICENSE file or at
      https://opensource.org/licenses/MIT.

linters:
  disable-all: true
  enable:
  # Custom
  - noprint # Use forbidigo instead?
  - nodebug
  - rangevarref

  # Standard
  - asasalint     # Bugs (variadic functions taking any)
  - bidichk       # Check for questionable Unicode
  - exportloopref # Smarter version of rangevarref?
  - goheader      # Enforce the copyright header
  - misspell      # Spelling
  - nakedret      # Not really sure what this one does
  - unconvert     # Lint (unnecessary conversions)

  # TODO Enable at some point
  # - maintidx      # Maintainability

  # Gosec panics on some of the generic code
  # - gosec         # Security
  # - nilerr        # Bugs (error checking)

  # Defaults
  - errcheck
  - gosimple
  - govet
  - ineffassign
  - staticcheck
  - typecheck
  - unused

  # - nestif # I'd like to enable this but I don't want to deal with the issues yet
  # - godox # Enable to find TODO/BUG/FIXME

issues:
  max-same-issues: 0

  exclude-rules:
  - path: cmd|test/cmd
    linters:
    - noprint

  - path: ^test/e2e2/generated
    linters:
    - goheader

  - path: ^test/|.*_test\.go
    linters:
    - noprint
    - gosec

  - path: smt/.*/RandHash\.go
    linters:
    - noprint

  # TODO: snapshot restore prints progress to stdout from library code. It is
  # operator-facing progress for a long, manually-driven operation, which is why
  # it exists, but it belongs on a logger so callers can route it. Threading one
  # through the snapshot reader/writer is a change in its own right.
  - path: ^internal/node/daemon/snapshots\.go$
    linters:
    - noprint

  # TODO: internal/database/snapshot.go prints progress to stdout from a library.
  # These should be logger calls; threading a logger through the snapshot writer
  # is a change in its own right, not something to fold into a toolchain bump.
  - path: ^internal/database/snapshot\.go$
    linters:
    - noprint

  - path: _gen.go$
    linters:
    - goheader
    - gosimple

  - path: ^(test/util/goroutine_leaks\.go|exp/tendermint/http\.go|exp/telemetry/translate\.go)$
    linters:
    - goheader

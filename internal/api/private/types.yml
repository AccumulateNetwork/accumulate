SequenceOptions:
  fields:
    - name: NodeID
      type: p2p.PeerID
      marshal-as: union
      zero-value: '""'
    # The sequence number of an anchor from the source that the REQUESTER
    # already holds and has already validated. The source roots its collection
    # proof at the state that anchor commits to, so the answer is verifiable
    # against something the requester has, rather than against anything the
    # directory has caught up to. That is what makes recovery work while the
    # network is behind, which is the only time it is needed (#4087, #4105).
    #
    # Zero means "you choose", which is what the anchor path does: a gap in the
    # anchor stream is bounded by the entry that exposed it, so the source can
    # infer the held anchor without being told.
    - name: ProveAgainstAnchor
      type: uint
SnapshotChunk:
  fields:
    - name: Block
      description: is the minor block the snapshot was taken at
      type: uint
    - name: Total
      description: is the total size of the snapshot in bytes
      type: uint
    - name: Offset
      description: is the offset of this chunk
      type: uint
    - name: Data
      description: is the chunk data
      type: bytes
    - name: Round
      description: is the consensus round that committed the epoch block (zero if unknown)
      type: uint
    - name: Epoch
      description: is the committee epoch of that round (may be zero)
      type: uint
    - name: StateRoot
      description: is the state tree anchor of the pinned block's prepared anchor, for verification against a directory receipt (BVN sync, #4058)
      type: hash

# PartitionRootRecord proves a BVN's state root into the directory (#4058
# phase 3b): the directory records every received partition anchor's
# StateTreeAnchor on a dedicated chain, so one receipt from that entry to a
# quorum-anchored directory root proves the state root without a separate BVN
# quorum check. DirectoryBlock is the directory block whose root chain anchor
# the receipt ends at — the client binds its verified spine to exactly that
# block and compares roots.
PartitionRootRecord:
  fields:
    - name: Receipt
      description: proves the state root entry into the directory root chain anchor
      type: merkle.Receipt
      marshal-as: reference
      pointer: true
    - name: DirectoryBlock
      description: is the directory block whose root chain anchor the receipt ends at
      type: uint

# StagingSnapshot is one page of a validator's staging as of its last
# committed block (executor.md, "Sync" step 2; healing.md, "Staging
# snapshot"). Block is on every page: a reader that pairs a page with a
# different block executes a different block, so a page whose Block differs
# from the first page's is not part of the same snapshot and the reader
# starts over. More says whether the snapshot continues from (NextLedger,
# NextSource, NextNumber, NextProofOffset) — and it says so explicitly,
# because NextLedger is nil for a source that holds proofs and no stream, so
# "the cursor is empty" cannot mean "there is no more" (#4291 review).
StagingSnapshot:
  fields:
    - name: Block
      description: |-
        is the CONSENSUS block index of the last block the executor processed — the index the block was opened with, published when it committed — and not the index of the last block whose state was written: an empty block writes nothing, so the system ledger's index can lag this one. It is at or above every block whose intake this page reflects, which is the safe direction. A joining node must NOT pair it with "the state of that block". Which block's state the node converges on is decided by the anchored-root match (#4293), and that block must be at or above this one
      type: uint
    - name: Streams
      description: is the streams, or parts of streams, this page carries
      type: StagedStream
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: NextLedger
      description: is the ledger of the stream the next page starts at; nil when the next page starts at a source that holds proofs and no stream, so it does not say whether there is a next page — More does
      type: url
      pointer: true
    - name: NextSource
      description: is the source of the stream the next page starts at, set whenever More is set
      type: url
      pointer: true
    - name: NextNumber
      description: is the first sequence number the next page carries
      type: uint
    - name: NextProofOffset
      description: is how many of that source's waiting proofs the reader already has, so a source with more proofs than one page can carry is paged
      type: uint
    - name: More
      description: is whether the snapshot continues at the cursor, set explicitly because a nil NextLedger is a real cursor
      type: bool

# StagedStream is one stream's stage, or the part of it a page carries. A
# stream with a nil Ledger carries nothing but the proofs of a source that
# holds proofs and no entries.
StagedStream:
  fields:
    - name: Ledger
      description: is the ledger that tracks the stream
      type: url
      pointer: true
    - name: Source
      description: is the partition the stream's messages come from
      type: url
      pointer: true
    - name: Delivered
      description: is how far the stream has executed
      type: uint
    - name: Sighted
      description: is the highest number ever held on the stream, executed or not
      type: uint
    - name: Entries
      description: is what the stream holds, unexecuted, ascending by number
      type: StagedEntry
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Validated
      description: is the hashes collection proofs have validated, ascending by number
      type: StagedHash
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Proofs
      description: is the collection proofs waiting for their Directory anchor, carried on the first page of the first stream of their source
      type: StagedProof
      marshal-as: reference
      pointer: true
      repeatable: true

# StagedEntry is one held entry: the message as it arrived, the transaction
# that travels with it when it has one, whether it was collected without a
# validated proof, and the sequenced message's hash — what a proof proves.
StagedEntry:
  fields:
    - name: Number
      description: is the entry's sequence number
      type: uint
    - name: Message
      description: is the message as it arrived
      type: messaging.Message
      marshal-as: union
    - name: Companion
      description: is the transaction that travels with the message, if any
      type: messaging.Message
      marshal-as: union
      optional: true
    - name: Collected
      description: is whether the entry was collected without a validated proof
      type: bool
    - name: Hash
      description: is the sequenced message's hash, what a proof proves
      type: hash

# StagedHash is a hash a collection proof validated at a sequence number.
StagedHash:
  fields:
    - name: Number
      description: is the sequence number the hash stands at
      type: uint
    - name: Hash
      description: is the validated hash
      type: hash

# StagedProof is a collection proof waiting for the Directory anchor block it
# terminates in.
StagedProof:
  fields:
    - name: AnchorBlock
      description: is the Directory anchor block the proof waits on
      type: uint
    - name: Proof
      description: is the proof itself
      type: protocol.AnnotatedReceipt
      marshal-as: reference
      pointer: true

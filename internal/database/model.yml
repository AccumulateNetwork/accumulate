# --------------------------------------------------------------------------
# This file is processed by the Accumulate model generator:
#   tools/cmd/gen-model
# To regenerate model_gen.go, run:
#   go run gitlab.com/accumulatenetwork/accumulate/tools/cmd/gen-model --package database model.yml
# DO NOT EDIT model_gen.go by hand; it is generated from this file.
# --------------------------------------------------------------------------
- name: Batch
  type: entity
  root: true
  customCommit: true
  customResolve: true
  fields:
  - name: done
    type: bool
  - name: writable
    type: bool
  - name: id
    type: string
  - name: nextChildId
    type: int
  - name: parent
    type: Batch
    pointer: true
  - name: observer
    type: Observer
  attributes:
  - name: BPT
    type: other
    dataType: bpt.BPT
    constructor: newBPT
    pointer: true

  - name: Account
    type: entity
    customCommit: true
    private: true
    parameters: # Indexed by the BPT
    - name: Url
      type: url
      pointer: true
    attributes:
    - name: Url
      type: state
      dataType: url
      pointer: true
      private: true
    - name: Main
      type: state
      dataType: protocol.Account
      union: true
    - name: Pending
      type: state
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: set
    - name: SyntheticForAnchor
      type: state
      parameters: # Not indexed (not used by exec v2)
      - name: Anchor
        type: hash
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: set
    - name: LocalDeliveryQueue
      description: is the ordered list of locally produced messages to execute at the start of the next block. Used only on the synthetic ledger (#4146)
      type: state
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: list
    - name: CascadeDeliveryQueue
      description: is the ordered list of ready sequenced messages whose execution was deferred to the next block. Used only on the synthetic ledger (#4146)
      type: state
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: list
    - name: Directory
      type: state
      collection: set
      dataType: url
      pointer: true
      emptyIfMissing: true

    # Execution output, like Delivered: written as a Directory anchor
    # executes. Staging itself is memory (executor spec, "Sync").
    - name: DirectoryAnchorBlock
      description: is the Directory block index of the newest Directory anchor executed here. Anchor staging compares a proof's anchor block against it to tell "not yet" from "never"
      type: state
      dataType: uint

    - name: Events
      description: tracks scheduled events. Should only be used on the system ledger
      type: entity
      attributes:
      - name: Minor
        description: tracks events scheduled for a DN minor block
        type: entity
        attributes:
        - name: Blocks
          type: state
          dataType: uint
          collection: set
        - name: Votes
          description: tracks authority votes that are pending due to a block hold
          type: state
          index: getVoteKeys # Indexed by blocks
          parameters:
          - name: Block
            type: uint
          customValueConstructor: true
          comparator: compareHeldAuthSig
          dataType: protocol.AuthoritySignature
          pointer: true
          collection: set
      - name: Major
        description: tracks events scheduled for a major block
        type: entity
        attributes:
        - name: Blocks
          type: state
          dataType: uint
          collection: set
        - name: Pending
          description: tracks pending transactions that will expire
          type: state
          index: getPendingKeys # Indexed by blocks
          parameters:
          - name: Block
            type: uint
          customValueConstructor: true
          dataType: txid
          pointer: true
          collection: set
      - name: Backlog
        description: used to limit the number of events processed per block
        type: entity
        attributes:
        - name: Expired
          description: tracks pending transactions that have expired
          type: state
          customValueConstructor: true
          dataType: txid
          pointer: true
          collection: set
      - name: BPT
        type: other
        dataType: bpt.BPT
        constructor: newBPT
        pointer: true

    - name: BlockLedger
      description: records which chains a block changed. One per non-empty block, keyed by block index, written once and never rewritten. Only the system ledger may hold it (executor spec, "The block ledger")
      type: state
      dataType: BlockLedger
      pointer: true
      index: getBlockLedgerKeys # Indexed by block, so snapshots carry them: a restored node rebuilds its account indices from them (tools/cmd/repair-indices), as it could from the per-block accounts this replaces
      parameters:
      - name: Index
        type: uint
    - name: BlockLedgerChain
      description: takes the hash of each block's ledger record, so the ledger account's hash commits to what every block changed (executor spec, "The block ledger")
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true

    - name: Transaction
      type: entity
      index: getTransactionKeys # Indexed by pending (more or less)
      parameters:
      - name: Hash
        type: hash
      attributes:
      - name: Payments
        description: records the hashes of credit payment messages
        type: state
        dataType: hash
        collection: set
      - name: Votes
        description: lists authorities that have voted on this transaction
        type: state
        dataType: VoteEntry
        collection: set
        pointer: true
        comparator: compareVoteEntries
      - name: Signatures
        description: records the active set of signatures
        type: state
        dataType: SignatureSetEntry
        collection: set
        pointer: true
        comparator: compareSignatureSetEntries
      - name: ValidatorSignatures
        description: records validators' signatures
        type: state
        dataType: protocol.KeySignature
        union: true
        collection: set
        comparator: compareSignatureByKey
      - name: History
        type: index
        description: records the signature chain index of entries for the transaction
        dataType: uint
        collection: set

    # Chains
    - name: MainChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: ScratchChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: SignatureChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: RootChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: BptChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: AnchorSequenceChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: MajorBlockChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: SyntheticSequenceChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
      private: true
      index: getSyntheticSequenceKeys
      parameters: # Indexed by chains
      - name: Partition
        type: string
    - name: SyntheticChain
      description: the synthetic messages this partition produced for one destination, in sequence order (executor spec, "One chain per pair, one stage per chain")
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
      private: true
      index: getSyntheticChainKeys
      parameters: # Indexed by chains
      - name: Partition
        type: string
    - name: AnchorChain
      type: entity
      private: true
      index: getAnchorKeys
      parameters: # Indexed by chains
      - name: Partition
        type: string
      attributes:
      - name: Root
        type: other
        dataType: Chain2
        hasChains: true
        pointer: true
      - name: BPT
        type: other
        dataType: Chain2
        hasChains: true
        pointer: true

    # Indices
    - name: Chains
      # This should be an index but because of a bug in the BPT calculations it
      # needs to be preserved a snapshot
      type: state
      dataType: protocol.ChainMetadata
      pointer: true
      collection: set
    - name: SyntheticAnchors
      type: index
      dataType: hash
      collection: set
    - name: EthereumTxHashes
      description: tracks used Ethereum transaction hashes to prevent replay attacks
      type: index
      dataType: hash
      collection: set
    - name: Data
      type: entity
      attributes:
      - name: Entry
        type: index
        collection: counted
        dataType: hash
      - name: Transaction
        type: index
        parameters: # Not indexed
        - name: EntryHash
          type: hash
        dataType: hash

  - name: Message
    type: entity
    parameters: # Not indexed directly
    - name: Hash
      type: hash
    attributes:
    - name: Main
      type: state
      dataType: messaging.Message
      union: true
      private: true
    - name: Cause
      type: index
      dataType: txid
      pointer: true
      collection: set
    - name: Produced
      type: index
      dataType: txid
      pointer: true
      collection: set
    - name: Signers
      type: index
      dataType: url
      pointer: true
      collection: set

  - name: Transaction
    type: entity
    private: true
    parameters: # Not indexed
    - name: Hash
      type: hash
    attributes:
    - name: Main
      type: state
      dataType: SigOrTxn
      pointer: true
    - name: Status
      type: state
      dataType: protocol.TransactionStatus
      emptyIfMissing: true
      pointer: true
      private: true
    - name: Produced
      type: state
      dataType: txid
      pointer: true
      collection: set
    - name: Signatures
      type: state
      dataType: sigSetData
      pointer: true
      private: true
      emptyIfMissing: true
      parameters: # Not indexed (not used by exec v2)
      - name: Signer
        type: url
        pointer: true

    # Indices
    - name: Chains
      type: index
      dataType: TransactionChainEntry
      pointer: true
      collection: set
      emptyIfMissing: true

  # System Indices
  - name: SystemData
    type: entity
    parameters: # Not indexed
    - name: Partition
      type: string
    attributes:
    - name: SyntheticIndexIndex
      # Indexes from a block index to a synthetic index chain index
      type: index
      dataType: uint
      parameters: # Not indexed
      - name: Block
        type: uint
    - name: ExecutedBlock
      # The block THIS node's executor last executed. It is here, under
      # SystemData, and not on <partition>/ledger, because the ledger is an
      # ACCOUNT and the join's pull overwrites accounts with a peer's
      # (#4344). Nothing outside this node's own executor writes it.
      type: index
      dataType: uint

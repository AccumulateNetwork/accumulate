# --------------------------------------------------------------------------
# This file is processed by the Accumulate model generator:
#   tools/cmd/gen-model
# To regenerate model_gen.go, run:
#   go run gitlab.com/accumulatenetwork/accumulate/tools/cmd/gen-model --package database model.yml
# DO NOT EDIT model_gen.go by hand; it is generated from this file.
# --------------------------------------------------------------------------
- name: Batch
  type: entity
  root: true
  customCommit: true
  customResolve: true
  fields:
  - name: done
    type: bool
  - name: writable
    type: bool
  - name: id
    type: string
  - name: nextChildId
    type: int
  - name: parent
    type: Batch
    pointer: true
  - name: observer
    type: Observer
  attributes:
  - name: BPT
    type: other
    dataType: bpt.BPT
    constructor: newBPT
    pointer: true

  - name: Account
    type: entity
    customCommit: true
    private: true
    parameters: # Indexed by the BPT
    - name: Url
      type: url
      pointer: true
    attributes:
    - name: Url
      type: state
      dataType: url
      pointer: true
      private: true
    - name: Main
      type: state
      dataType: protocol.Account
      union: true
    - name: Pending
      type: state
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: set
    - name: SyntheticForAnchor
      type: state
      parameters: # Not indexed (not used by exec v2)
      - name: Anchor
        type: hash
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: set
    - name: LocalDeliveryQueue
      description: is the ordered list of locally produced messages to execute at the start of the next block. Used only on the synthetic ledger (#4146)
      type: state
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: list
    - name: CascadeDeliveryQueue
      description: is the ordered list of ready sequenced messages whose execution was deferred to the next block. Used only on the synthetic ledger (#4146)
      type: state
      dataType: txid
      emptyIfMissing: true
      pointer: true
      collection: list
    - name: Directory
      type: state
      collection: set
      dataType: url
      pointer: true
      emptyIfMissing: true

    # Staging (#4189). Used on the accounts that track ordered cross-partition
    # streams: the synthetic ledger and the anchor pool.
    #
    # NOT hashed. Staging decides what a block executes, so every node must hold
    # the same thing -- but it is a deterministic function of the consensus
    # stream, so it is agreed without being hashed, and hashing it is what
    # forced it into main state and forced main state to be bounded. It is
    # `state` rather than `index` so that snapshots collect it: a snapshot is
    # what a new node starts from, and one without staging diverges on the new
    # node's first block.
    - name: StagedSources
      description: lists the partitions staging holds anything from. Bounded by the number of peers, and the reason the staged records can be enumerated for a snapshot at all (#4189)
      type: state
      dataType: url
      pointer: true
      collection: set
      emptyIfMissing: true
    - name: Sequenced
      description: is the message received for a sequence number of an inbound stream, whether or not it has been executed. A number is HELD if this exists and the number is above the stream's Delivered watermark (#4189)
      type: state
      index: getSequencedKeys # Indexed by source and number, so snapshots collect it
      dataType: txid
      pointer: true
      parameters:
      - name: Source
        type: url
        pointer: true
      - name: Number
        type: uint
    - name: Sighted
      description: is the highest sequence number received from a source, whether or not it has been executed. It is what says a stream is behind (#4189)
      type: state
      index: getSightedKeys # Indexed by source, so snapshots collect it
      dataType: uint
      parameters:
      - name: Source
        type: url
        pointer: true

    - name: Events
      description: tracks scheduled events. Should only be used on the system ledger
      type: entity
      attributes:
      - name: Minor
        description: tracks events scheduled for a DN minor block
        type: entity
        attributes:
        - name: Blocks
          type: state
          dataType: uint
          collection: set
        - name: Votes
          description: tracks authority votes that are pending due to a block hold
          type: state
          index: getVoteKeys # Indexed by blocks
          parameters:
          - name: Block
            type: uint
          customValueConstructor: true
          comparator: compareHeldAuthSig
          dataType: protocol.AuthoritySignature
          pointer: true
          collection: set
      - name: Major
        description: tracks events scheduled for a major block
        type: entity
        attributes:
        - name: Blocks
          type: state
          dataType: uint
          collection: set
        - name: Pending
          description: tracks pending transactions that will expire
          type: state
          index: getPendingKeys # Indexed by blocks
          parameters:
          - name: Block
            type: uint
          customValueConstructor: true
          dataType: txid
          pointer: true
          collection: set
      - name: Backlog
        description: used to limit the number of events processed per block
        type: entity
        attributes:
        - name: Expired
          description: tracks pending transactions that have expired
          type: state
          customValueConstructor: true
          dataType: txid
          pointer: true
          collection: set
      - name: BPT
        type: other
        dataType: bpt.BPT
        constructor: newBPT
        pointer: true

    - name: BlockLedger
      description: indexes entries of a block. Should only be used on the system ledger
      type: other
      dataType: indexing.Log[*BlockLedger]
      constructor: newBlockEntryLog
      pointer: true

    - name: Transaction
      type: entity
      index: getTransactionKeys # Indexed by pending (more or less)
      parameters:
      - name: Hash
        type: hash
      attributes:
      - name: Payments
        description: records the hashes of credit payment messages
        type: state
        dataType: hash
        collection: set
      - name: Votes
        description: lists authorities that have voted on this transaction
        type: state
        dataType: VoteEntry
        collection: set
        pointer: true
        comparator: compareVoteEntries
      - name: Signatures
        description: records the active set of signatures
        type: state
        dataType: SignatureSetEntry
        collection: set
        pointer: true
        comparator: compareSignatureSetEntries
      - name: ValidatorSignatures
        description: records validators' signatures
        type: state
        dataType: protocol.KeySignature
        union: true
        collection: set
        comparator: compareSignatureByKey
      - name: History
        type: index
        description: records the signature chain index of entries for the transaction
        dataType: uint
        collection: set

    # Chains
    - name: MainChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: ScratchChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: SignatureChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: RootChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: BptChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: AnchorSequenceChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: MajorBlockChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
    - name: SyntheticSequenceChain
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
      private: true
      index: getSyntheticSequenceKeys
      parameters: # Indexed by chains
      - name: Partition
        type: string
    - name: SyntheticReplica
      description: is the destination's replica of a source's synthetic sequence, keyed on stream identity (#4140)
      type: other
      dataType: Chain2
      hasChains: true
      pointer: true
      private: true
      index: getSyntheticReplicaKeys
      parameters: # Indexed by chains
      - name: Stream
        type: string
    - name: AnchorChain
      type: entity
      private: true
      index: getAnchorKeys
      parameters: # Indexed by chains
      - name: Partition
        type: string
      attributes:
      - name: Root
        type: other
        dataType: Chain2
        hasChains: true
        pointer: true
      - name: BPT
        type: other
        dataType: Chain2
        hasChains: true
        pointer: true

    # Indices
    - name: Chains
      # This should be an index but because of a bug in the BPT calculations it
      # needs to be preserved a snapshot
      type: state
      dataType: protocol.ChainMetadata
      pointer: true
      collection: set
    - name: SyntheticAnchors
      type: index
      dataType: hash
      collection: set
    - name: EthereumTxHashes
      description: tracks used Ethereum transaction hashes to prevent replay attacks
      type: index
      dataType: hash
      collection: set
    - name: Data
      type: entity
      attributes:
      - name: Entry
        type: index
        collection: counted
        dataType: hash
      - name: Transaction
        type: index
        parameters: # Not indexed
        - name: EntryHash
          type: hash
        dataType: hash

  - name: Message
    type: entity
    parameters: # Not indexed directly
    - name: Hash
      type: hash
    attributes:
    - name: Main
      type: state
      dataType: messaging.Message
      union: true
      private: true
    - name: Cause
      type: index
      dataType: txid
      pointer: true
      collection: set
    - name: Produced
      type: index
      dataType: txid
      pointer: true
      collection: set
    - name: Signers
      type: index
      dataType: url
      pointer: true
      collection: set

  - name: Transaction
    type: entity
    private: true
    parameters: # Not indexed
    - name: Hash
      type: hash
    attributes:
    - name: Main
      type: state
      dataType: SigOrTxn
      pointer: true
    - name: Status
      type: state
      dataType: protocol.TransactionStatus
      emptyIfMissing: true
      pointer: true
      private: true
    - name: Produced
      type: state
      dataType: txid
      pointer: true
      collection: set
    - name: Signatures
      type: state
      dataType: sigSetData
      pointer: true
      private: true
      emptyIfMissing: true
      parameters: # Not indexed (not used by exec v2)
      - name: Signer
        type: url
        pointer: true

    # Indices
    - name: Chains
      type: index
      dataType: TransactionChainEntry
      pointer: true
      collection: set
      emptyIfMissing: true

  # System Indices
  - name: SystemData
    type: entity
    parameters: # Not indexed
    - name: Partition
      type: string
    attributes:
    - name: SyntheticIndexIndex
      # Indexes from a block index to a synthetic index chain index
      type: index
      dataType: uint
      parameters: # Not indexed
      - name: Block
        type: uint

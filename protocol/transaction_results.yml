EmptyResult:
  union: { type: result, value: Unknown }
  fields: []

WriteDataResult:
  union: { type: result }
  fields:
    - name: EntryHash
      type: hash
    - name: AccountUrl
      type: url
      pointer: true
    - name: AccountID
      type: bytes

AddCreditsResult:
  union: { type: result }
  fields:
    - name: Amount
      type: bigint
    - name: Credits
      type: uvarint
    - name: Oracle
      type: uvarint

ReleaseLockedOperationResult:
  union: { type: result }
  description: result of releasing a locked deposit, includes preimage for cross-chain extraction
  fields:
    - name: Preimage
      description: the revealed preimage
      type: bytes
    - name: Hash
      description: the hash that was unlocked
      type: hash
    - name: Amount
      description: the amount of tokens released
      type: bigint
    - name: Token
      description: the token type released
      type: url
      pointer: true
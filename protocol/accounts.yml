# Accounts - names should be nouns

UnknownAccount:
  union: { type: account, value: Unknown }
  fields:
    - name: Url
      type: url
      pointer: true

UnknownSigner:
  union: { type: account }
  fields:
    - name: Url
      type: url
      pointer: true
    - name: Version
      type: uvarint

LiteIdentity:
  union: { type: account }
  fields:
    - name: Url
      type: url
      pointer: true
    - name: CreditBalance
      type: uvarint
    - name: LastUsedOn
      type: uvarint

LiteTokenAccount:
  union: { type: account, value: LiteTokenAccount }
  fields:
    - name: Url
      type: url
      pointer: true
    - name: TokenUrl
      type: url
      pointer: true
    - name: Balance
      type: bigint
    - name: LockHeight
      description: is the major block height after which the balance can be transferred out of this account
      type: uint

LiteDataAccount:
  union: { type: account, value: LiteDataAccount }
  fields:
    - name: Url
      type: url
      pointer: true

ADI:
  union: { type: account, value: Identity }
  fields:
    - name: Url
      type: url
      pointer: true
    - type: AccountAuth
      marshal-as: reference

TokenAccount:
  union: { type: account, value: TokenAccount }
  fields:
    - name: Url
      type: url
      pointer: true
    - type: AccountAuth
      marshal-as: reference
    - name: TokenUrl
      type: url
      pointer: true
    - name: Balance
      type: bigint

KeyBook:
  union: { type: account }
  fields:
    - name: Url
      type: url
      pointer: true
    - name: BookType
      type: BookType
      marshal-as: enum
    - type: AccountAuth
      marshal-as: reference
    - name: PageCount
      type: uvarint

KeyPage:
  union: { type: account }
  fields:
    # Key pages do not have their own auth. They are subordinate to the key book
    # they are part of.
    - { name: KeyBook, type: url, pointer: true, virtual: true, non-binary: true }
    - name: Url
      type: url
      pointer: true
    - name: CreditBalance
      type: uvarint
    - name: AcceptThreshold
      type: uvarint
      alternative: Threshold
      description: is the number of acceptances required to accept a transaction
    - name: RejectThreshold
      type: uvarint
      description: is the number of rejections required to reject a transaction
    - name: ResponseThreshold
      type: uvarint
      description: is the number of responses that must be received before a transaction will be processed
    - name: BlockThreshold
      type: uvarint
      description: is the number of minor blocks that must elapse before a transaction will be processed
    - name: Version
      type: uvarint
    - name: Keys
      repeatable: true
      type: KeySpec
      pointer: true
      marshal-as: reference
    - name: TransactionBlacklist
      type: AllowedTransactions
      marshal-as: enum
      pointer: true
      optional: true

DataAccount:
  union: { type: account, value: DataAccount }
  fields:
    - name: Url
      type: url
      pointer: true
    - type: AccountAuth
      marshal-as: reference
    - name: Entry
      type: DataEntry
      marshal-as: union
      optional: true

MiningAuthority:
  union: { type: account }
  description: manages LXR proof-of-work mining requirements for anti-spam protection
  fields:
    - name: Url
      type: url
      pointer: true
    - type: AccountAuth
      marshal-as: reference
    - name: Enabled
      description: indicates if mining is currently active
      type: bool
    - name: Difficulty
      description: is the minimum difficulty required for proof-of-work
      type: uint
    - name: TableSize
      description: is the size of the LXR hash table (as power of 2, e.g., 30 = 1GB)
      type: uint
    - name: TableSeed
      description: is the seed used to generate the LXR hash table
      type: uint
    - name: Passes
      description: is the number of passes through the LXR hash table
      type: uint
    - name: AuthorizedMiners
      description: is a list of identity URLs authorized to mine (empty = open mining)
      type: url
      pointer: true
      repeatable: true
      optional: true
    - name: Statistics
      description: tracks mining statistics and metrics
      type: MiningStatistics
      marshal-as: reference
      pointer: true
      optional: true

TokenIssuer:
  union: { type: account }
  fields:
    - name: Url
      type: url
      pointer: true
    - type: AccountAuth
      marshal-as: reference
    - name: Symbol
      type: string
    - name: Precision
      type: uvarint
    - name: Properties
      type: url
      pointer: true
    - name: Issued
      type: bigint
    - name: SupplyLimit
      type: bigint
      pointer: true
      optional: true

id: "DAGBFTTest-2v-3b"

# Bootstrap node configuration for Docker peer discovery
bootstrap:
  peerAddress: "acc-bootstrap-2v-3b"
  advertizeAddress: "acc-bootstrap-2v-3b"
  listenAddress: "0.0.0.0"
  basePort: 16593

# Global network configuration
globals:
  executorVersion: "v2"
  oracle:
    price: 10000000  # 1000 * AcmeOraclePrecision (netsim default: 0.10 USD per ACME)
  globals:
    majorBlockSchedule: "0 */12 * * *"  # Major blocks every 12 hours

bvns:
  - id: "BVN1"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn1-val1-2v-3b"
        advertizeAddress: "acc-bvn1-val1-2v-3b"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"

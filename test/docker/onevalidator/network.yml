id: "OneValJiuquan"

# One validator (new binary, Jiuquan) + 6 followers (old v1.4.4.2). DN + 1 BVN,
# all dual. Genesis at Jiuquan so the validator runs the #4070 held-and-retry;
# the old followers lack that code (behave pre-Jiuquan). Induced synthetic/anchor
# drops trigger the divergent path. Does the network survive?

bootstrap:
  peerAddress: "acc-bootstrap"
  advertizeAddress: "acc-bootstrap"
  listenAddress: "0.0.0.0"
  basePort: 16593

globals:
  executorVersion: "v2-jiuquan"
  oracle:
    price: 10000000
  globals:
    majorBlockSchedule: "0 */12 * * *"

bvns:
  - id: "BVN1"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n1"
        advertizeAddress: "acc-n1"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n2"
        advertizeAddress: "acc-n2"
        basePort: 26656
        dnnType: "follower"
        bvnnType: "follower"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n3"
        advertizeAddress: "acc-n3"
        basePort: 26656
        dnnType: "follower"
        bvnnType: "follower"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n4"
        advertizeAddress: "acc-n4"
        basePort: 26656
        dnnType: "follower"
        bvnnType: "follower"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n5"
        advertizeAddress: "acc-n5"
        basePort: 26656
        dnnType: "follower"
        bvnnType: "follower"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n6"
        advertizeAddress: "acc-n6"
        basePort: 26656
        dnnType: "follower"
        bvnnType: "follower"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-n7"
        advertizeAddress: "acc-n7"
        basePort: 26656
        dnnType: "follower"
        bvnnType: "follower"

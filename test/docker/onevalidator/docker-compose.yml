# One-validator Jiuquan-vs-followers test. acc-n1 = validator on the NEW binary
# (acc-synthheal:test) with the #4070 held code AND induced synthetic/anchor drops. acc-n2..n7
# = followers on the OLD deployed binary (acc-mixver-old:1442), which lack the held code. Genesis
# at Jiuquan. Question: when a dropped anchor makes the validator HOLD a synthetic,
# can the old followers (which terminal-fail it) still follow — or do they diverge?
services:
  bootstrap:
    image: acc-synthheal:test
    container_name: acc-bootstrap
    mem_limit: 1g
    entrypoint: ["/bin/accumulated-bootstrap"]
    command: ["--listen","/ip4/0.0.0.0/tcp/16593","--key","626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"]
    restart: unless-stopped

  init:
    image: acc-synthheal:test
    container_name: acc-ov-init
    entrypoint: ["sh","-c"]
    command:
      - |
        if [ -f /root/.accumulate/init-done ]; then echo 'already initialized'; exit 0; fi
        accumulated init network /workspace/test/docker/onevalidator/network.yml --reset --faucet-seed=FAUCET
        for d in /root/.accumulate/bvn*-?; do
          grep -q 'acc-bootstrap' "$$d/accumulate.toml" || sed -i 's|^\[p2p\]|[p2p]\n  bootstrap-peers = ["/dns/acc-bootstrap/tcp/16593/p2p/12D3KooWRq3UGwehqoLWg6wDLJDQHduhUbQZ5UHPXKgkPvvWYfvg"]\n  discovery-mode = "auto-server"\n  enable-peer-tracking = true|' "$$d/accumulate.toml"
          grep -q '\[instrumentation\]' "$$d/accumulate.toml" || printf '\n[instrumentation]\nlisten = ["/ip4/0.0.0.0/tcp/26670/http"]\n' >> "$$d/accumulate.toml"
        done
        touch /root/.accumulate/init-done
    volumes:
      - network-config:/root/.accumulate
      - ../../..:/workspace
    working_dir: /workspace

  n1:
    image: acc-synthheal:test   # VALIDATOR/NEW+drops
    container_name: acc-n1
    mem_limit: 4g
    restart: unless-stopped
    environment:
      ACC_DEBUG_DROP_ANCHOR: "BVN1:%2+1"
      ACC_DEBUG_DROP_SYNTHETIC: "*:%50+1"
    command: ["-w=/root/.accumulate/bvn1-1","/root/.accumulate/bvn1-1/accumulate.toml"]
    ports:
      - "26660:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  n2:
    image: acc-mixver-old:1442   # FOLLOWER/OLD
    container_name: acc-n2
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-2","/root/.accumulate/bvn1-2/accumulate.toml"]
    ports:
      - "26661:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  n3:
    image: acc-mixver-old:1442   # FOLLOWER/OLD
    container_name: acc-n3
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-3","/root/.accumulate/bvn1-3/accumulate.toml"]
    ports:
      - "26662:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  n4:
    image: acc-mixver-old:1442   # FOLLOWER/OLD
    container_name: acc-n4
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-4","/root/.accumulate/bvn1-4/accumulate.toml"]
    ports:
      - "26663:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  n5:
    image: acc-mixver-old:1442   # FOLLOWER/OLD
    container_name: acc-n5
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-5","/root/.accumulate/bvn1-5/accumulate.toml"]
    ports:
      - "26664:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  n6:
    image: acc-mixver-old:1442   # FOLLOWER/OLD
    container_name: acc-n6
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-6","/root/.accumulate/bvn1-6/accumulate.toml"]
    ports:
      - "26665:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  n7:
    image: acc-mixver-old:1442   # FOLLOWER/OLD
    container_name: acc-n7
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-7","/root/.accumulate/bvn1-7/accumulate.toml"]
    ports:
      - "26666:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

volumes:
  network-config:

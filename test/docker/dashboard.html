<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accumulate Load Test Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 10px;
        }
        h1 { font-size: 2.2em; margin-bottom: 5px; }
        .subtitle { font-size: 1.1em; opacity: 0.8; }
        .test-label { font-size: 1.4em; margin-top: 10px; color: #f39c12; }
        .status {
            display: inline-block; padding: 4px 12px;
            border-radius: 20px; font-size: 0.85em; margin-top: 8px;
        }
        .status.connected { background: #27ae60; }
        .status.disconnected { background: #e74c3c; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; margin-bottom: 20px;
        }
        .metric-card {
            background: #1a1f3a; padding: 15px; border-radius: 8px;
            border: 1px solid #2a3f5f;
        }
        .metric-label { font-size: 0.85em; opacity: 0.7; margin-bottom: 5px; }
        .metric-value { font-size: 2em; font-weight: bold; }
        .metric-value.good { color: #27ae60; }
        .metric-value.warning { color: #f39c12; }
        .metric-unit { font-size: 0.5em; opacity: 0.8; margin-left: 4px; }
        .metric-sub { font-size: 0.8em; opacity: 0.6; margin-top: 3px; }
        .chart-container {
            background: #1a1f3a; padding: 15px; border-radius: 8px;
            border: 1px solid #2a3f5f; margin-bottom: 20px; height: 280px;
        }
        .section-title {
            font-size: 1.4em; margin: 20px 0 10px 0;
            padding-bottom: 8px; border-bottom: 2px solid #2a5298;
        }
        .log-container {
            background: #0d1117; padding: 15px; border-radius: 8px;
            border: 1px solid #2a3f5f; height: 250px;
            overflow-y: auto; font-family: monospace; font-size: 0.85em;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid #161b22; }
        .log-time { color: #58a6ff; margin-right: 10px; }
        .log-msg { color: #c9d1d9; }
        .metric-value.bad { color: #e74c3c; }
        .timestamp { text-align: center; opacity: 0.5; font-size: 0.85em; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Accumulate Load Test Dashboard</h1>
        <div class="subtitle">Performance Test Suite</div>
        <div class="test-label" id="test-label">--</div>
        <div class="status connected" id="status">Connected</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">Current TPS (15s window)</div>
            <div class="metric-value good" id="tps">0<span class="metric-unit">tx/s</span></div>
            <div class="metric-sub" id="tps-target">Target: --</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Peak TPS</div>
            <div class="metric-value" id="peak">0<span class="metric-unit">tx/s</span></div>
            <div class="metric-sub" id="avg-tps">Avg: --</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Total Transactions</div>
            <div class="metric-value" id="total-txns">0</div>
            <div class="metric-sub" id="success-rate">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Error Rate</div>
            <div class="metric-value" id="error-rate">0<span class="metric-unit">%</span></div>
            <div class="metric-sub" id="failed-count">0 failed</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Workers / Nodes</div>
            <div class="metric-value" id="workers">0</div>
            <div class="metric-sub" id="nodes-info">0 nodes</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Elapsed</div>
            <div class="metric-value" id="elapsed">--</div>
            <div class="metric-sub">&nbsp;</div>
        </div>
    </div>

    <h2 class="section-title">TPS History</h2>
    <div class="chart-container">
        <canvas id="tpsChart"></canvas>
    </div>

    <h2 class="section-title">Test Log</h2>
    <div class="log-container" id="log-container"></div>

    <div class="timestamp" id="last-update">Last update: --</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const UPDATE_INTERVAL = 2000;
        const LOG_INTERVAL = 5000;
        let statusFailures = 0;
        let logFailures = 0;

        const ctx = document.getElementById('tpsChart').getContext('2d');
        const tpsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'TPS (15s window)',
                        data: [],
                        borderColor: '#27ae60',
                        backgroundColor: 'rgba(39, 174, 96, 0.1)',
                        borderWidth: 2, tension: 0.3, fill: true
                    },
                    {
                        label: 'Target TPS',
                        data: [],
                        borderColor: '#e74c3c',
                        borderWidth: 1, borderDash: [5, 5],
                        pointRadius: 0, fill: false
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#2a3f5f' }, ticks: { color: '#e0e0e0' } },
                    x: { grid: { color: '#2a3f5f' }, ticks: { color: '#e0e0e0', maxTicksLimit: 20 } }
                },
                plugins: { legend: { labels: { color: '#e0e0e0' } } },
                animation: false
            }
        });

        function updateMetrics() {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    statusFailures = 0;
                    const stale = data.stale || false;
                    document.getElementById('status').className = stale ? 'status disconnected' : 'status connected';
                    document.getElementById('status').textContent = stale ? 'Stale' : 'Connected';

                    document.getElementById('test-label').textContent = data.test_label || '--';

                    const tps = data.current_tps || 0;
                    const target = data.target_tps || 0;
                    const peak = data.peak_tps || 0;
                    const avg = data.avg_tps || 0;
                    const total = data.submitted || 0;
                    const succeeded = data.succeeded || 0;
                    const failed = data.failed || 0;
                    const errorRate = data.error_rate || 0;

                    document.getElementById('tps').innerHTML = Math.round(tps).toLocaleString() + '<span class="metric-unit">tx/s</span>';
                    const tpsEl = document.getElementById('tps');
                    tpsEl.className = 'metric-value ' + (tps >= target * 0.9 ? 'good' : tps >= target * 0.5 ? 'warning' : '');
                    document.getElementById('tps-target').textContent = 'Target: ' + target.toLocaleString() + ' TPS';

                    document.getElementById('peak').innerHTML = Math.round(peak).toLocaleString() + '<span class="metric-unit">tx/s</span>';
                    document.getElementById('avg-tps').textContent = 'Avg: ' + Math.round(avg).toLocaleString() + ' TPS';

                    document.getElementById('total-txns').textContent = total.toLocaleString();
                    document.getElementById('success-rate').textContent = succeeded.toLocaleString() + ' succeeded';

                    document.getElementById('error-rate').innerHTML = errorRate.toFixed(2) + '<span class="metric-unit">%</span>';
                    document.getElementById('error-rate').className = 'metric-value ' + (errorRate > 5 ? 'bad' : errorRate > 1 ? 'warning' : '');
                    document.getElementById('failed-count').textContent = failed.toLocaleString() + ' failed';

                    document.getElementById('workers').textContent = data.workers || 0;
                    document.getElementById('nodes-info').textContent = (data.nodes || 0) + ' nodes';

                    document.getElementById('elapsed').textContent = data.elapsed || '--';

                    // Chart
                    const now = new Date().toLocaleTimeString();
                    tpsChart.data.labels.push(now);
                    tpsChart.data.datasets[0].data.push(tps);
                    tpsChart.data.datasets[1].data.push(target);
                    if (tpsChart.data.labels.length > 150) {
                        tpsChart.data.labels.shift();
                        tpsChart.data.datasets[0].data.shift();
                        tpsChart.data.datasets[1].data.shift();
                    }
                    tpsChart.update('none');

                    document.getElementById('last-update').textContent = 'Last update: ' + now;
                })
                .catch(() => {
                    statusFailures++;
                    document.getElementById('status').className = 'status disconnected';
                    document.getElementById('status').textContent = 'Disconnected (' + statusFailures + ')';
                });
        }

        function updateLog() {
            fetch('/log')
                .then(r => r.json())
                .then(entries => {
                    const container = document.getElementById('log-container');
                    container.innerHTML = '';
                    entries.forEach(e => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'log-time';
                        timeSpan.textContent = e.time ? e.time.substring(11, 19) : '';
                        const msgSpan = document.createElement('span');
                        msgSpan.className = 'log-msg';
                        msgSpan.textContent = e.msg || '';
                        div.appendChild(timeSpan);
                        div.appendChild(msgSpan);
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                })
                .catch(() => {});
        }

        updateMetrics();
        updateLog();
        setInterval(updateMetrics, UPDATE_INTERVAL);
        setInterval(updateLog, LOG_INTERVAL);
    </script>
</body>
</html>

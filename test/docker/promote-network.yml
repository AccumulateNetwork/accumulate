# Follower-to-validator failover test (#4050): a single BVN with 1 validator and
# 4 followers (5 dual DN+BVN nodes). node bvn1-1 is the validator; bvn1-2..5 are
# followers. Static peering via docker DNS hostnames (accp-bvn1-N).
id: FailoverTest

# Without this the net silently boots ExecutorVersion 0 -> the legacy v1
# executor, whose one-shot anchor dispatch has no retry and whose crosschain
# Conductor (anchor producer + #4056 healer) is v2-gated and never runs, so a
# lost bootstrap anchor wedges cross-partition delivery forever.
globals:
  executorVersion: "v2-kourou"

bvns:
  - id: BVN1
    nodes:
      - { listenAddress: "0.0.0.0", advertizeAddress: "accp-bvn1-1", peerAddress: "accp-bvn1-1", basePort: 26656, dnnType: validator, bvnnType: validator }
      - { listenAddress: "0.0.0.0", advertizeAddress: "accp-bvn1-2", peerAddress: "accp-bvn1-2", basePort: 26656, dnnType: follower,  bvnnType: follower }
      - { listenAddress: "0.0.0.0", advertizeAddress: "accp-bvn1-3", peerAddress: "accp-bvn1-3", basePort: 26656, dnnType: follower,  bvnnType: follower }
      - { listenAddress: "0.0.0.0", advertizeAddress: "accp-bvn1-4", peerAddress: "accp-bvn1-4", basePort: 26656, dnnType: follower,  bvnnType: follower }
      - { listenAddress: "0.0.0.0", advertizeAddress: "accp-bvn1-5", peerAddress: "accp-bvn1-5", basePort: 26656, dnnType: follower,  bvnnType: follower }

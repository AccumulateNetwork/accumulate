# Phase 1's acceptance (#4364; PLAN.md E11, second pass, "Done when"). Paul,
# 2026-09-19: the network can run chaos for 12 hours while adding and removing
# followers while carrying a 100 tps load.
#
#   ./soak.sh -c 12h-100tps-followers.conf "phase 1 acceptance: 12h, 100 tps, followers added and removed, validators restarted"
#
# Paul's to start. It supersedes 24h-100tps-chaos.conf, which is no longer the
# acceptance of anything.
#
# ONE RATE, START TO FINISH. Do not touch the loadgen control API.
#
# The walk (soak.sh's chaos loop, both walks on): the slots alternate
# validator, follower. A validator slot disturbs the next validator in turn,
# restart and pause alternating; a follower slot adds acc-bvn3-fol2 (a node
# the network has never seen, databases cleared, key in no committee) or
# removes it, in turn, for the whole run. No slot is a no-op. acc-bvn3-fol1
# runs from genesis beside it and is never disturbed.
#
# Cadence as 30m-100tps-chaos.conf: a slot every 120s + 0-60s, so ~290 slots
# in twelve hours, ~145 validator disturbances and ~70 add/remove pairs. Each
# added follower has one validator slot plus its own (~5 minutes, less the
# 30s reading before its removal) to reach ACTIVE.
#
# Judged on, over the whole run:
#   - every restarted validator's anchor body (root + bpt) equals its peers'
#     on both of its partitions, and the Directory stays 12 of 12;
#   - delivered advances on every synthetic flow;
#   - every added follower reaches ACTIVE and matches a validator's root
#     (chaos.log: `ACTIVE`, `first root match`; never `NEVER ACTIVE` or
#     `never matched`);
#   - every removal leaves block cadence and every stream's delivered alone
#     (chaos.log: `unaffected`, never `AFFECTED`).
#
# STALL_KILL_SECS and the watchdogs are soak.conf's.
DURATION=12h
TPS=100

CHAOS=on
CHAOS_VALIDATORS=on
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
CHAOS_SKIP_ONE_IN=0
CHAOS_MIN=120
CHAOS_JITTER=60

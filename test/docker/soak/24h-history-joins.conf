# A long-lived network that builds a significant history, with fresh followers
# joining it again and again as the history grows (#4438).
#
#   ./soak.sh -c 24h-history-joins.conf "#4438: join against a growing history"
#
# Paul, 2026-09-25: "Keep the network running because it needs a significant
# history." No validator is disturbed. Every CHAOS_MIN the late followers
# (BVN1, BVN2, BVN3) are added together, databases cleared, joining; a slot
# later they are removed; then added again against a longer history.
#
# Load starts at 1 tps so the monitor can be shown first; raise it with
#   curl -X POST -d '{"tps": 10}' http://127.0.0.1:8091/control
DURATION=24h
TPS=1
LG_BOOTSTRAP=100
CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
FOLLOWER_WINDOW_SECS=30
CHAOS_MIN=3600
CHAOS_JITTER=60
STALL_KILL_SECS=90

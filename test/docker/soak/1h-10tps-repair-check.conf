# One hour at 10 tps with no disturbance from the harness: the network for the
# #4523 repair check, done by hand. acc-bvn3-fol1, the follower that runs from
# genesis and retains BPT history, is stopped, has one stored block torn with
# test/cmd/tear-block, and is started again: it must condemn the sections under
# the block, load them again, and go ACTIVE (executor spec, "Sync", §3b). Then
# the same with the failure recorded and repaired offline with
# `accumulated debug repair`.
#
#   ./soak.sh -c 1h-10tps-repair-check.conf "#4523: repair check by hand"
#
# ONE RATE, START TO FINISH. Do not touch the loadgen control API.
DURATION=1h
TPS=10

CHAOS=off

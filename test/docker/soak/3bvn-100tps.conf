# Three BVNs at 100 tps, no chaos, one hour.
#
# The question is distribution, not throughput: with buckets divided evenly
# (#4136) the three BVNs should carry the same share of accounts and the same
# share of the work, where bit prefixes gave the first BVN 50% and the other
# two 25% each. 100 tps is well under the knee so that any imbalance is the
# routing's and not the executor running out of room.
DURATION=1h
TPS=100
CHAOS=off

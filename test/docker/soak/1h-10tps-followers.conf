# One hour at 10 tps with the late followers added and removed every ~10
# minutes, no validator disturbed: the check that a follower's repair after its
# first-block mismatch takes seconds, not minutes (#4519; run 20261004T151138Z
# took 5-13 minutes per follower before it).
#
#   ./soak.sh -c 1h-10tps-followers.conf "#4519: follower repair time at 10 tps"
#
# Three adds (~10, ~30, ~50 min), two removals. A check, not an acceptance:
# 12h-10tps-followers.conf is that.
#
# The harness logs a follower ACTIVE once and does not see a later demotion
# (#4520): read `Repairing the state` / `it is ACTIVE` in the node logs.
#
# ONE RATE, START TO FINISH. Do not touch the loadgen control API.
DURATION=1h
TPS=10

CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
CHAOS_SKIP_ONE_IN=0
CHAOS_MIN=600
CHAOS_JITTER=30

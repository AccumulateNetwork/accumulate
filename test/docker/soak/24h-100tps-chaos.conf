# Twenty-four hours at 100 tps, three BVNs, chaos on.
#
# Kept as a record of the 2026-09-17 restart-only run. It closes nothing: #4205
# and phase 1 close on 12h-100tps-followers.conf, twelve hours with followers
# added and removed and validators restarted (PLAN.md E11, second pass).
#
# ONE RATE, START TO FINISH. The previous attempt (20260917T184129Z) moved the
# rate 100 -> 200 -> 300 inside its first 41 minutes, so when it wedged the
# onset could not be dated and nothing under test was cleared or convicted. Do
# not touch the loadgen control API during this run.
#
# Three changes are under test, all landed 2026-09-17:
#   #4277  the heartbeat: a partition anchors a block whose only content is a
#          received directory anchor, so an idle network no longer quiesces
#          and every state-tree root stays provable.
#   #4277  the restart fix: a partition puts back the anchors it produced when
#          it starts, which it could not serve at all before. Chaos is what
#          exercises this, which is why it is on.
#   #4282  anchor staging bounded by bytes rather than by distinct Directory
#          blocks, and a package refused with its proof when that budget
#          binds. This is what the last run died of.
#
# What to watch, in order of what would end the run:
#   - delivered must keep advancing on every synthetic flow. Neither watchdog
#     can see a delivery stall (both classify from block height), so the flow
#     matrix going red is the signal, not the wedge counter.
#   - staged_proofs{refused} should stay at or near zero. It climbing while
#     staged is frozen is #4282 returning in a new currency.
#   - heals must stay at zero. With the restart fix a restarted node should be
#     answerable, so a heal means it is not.
#
# Relaunched 2026-09-17 ~22:40Z from dagbft-integration 816fde076, after the
# 30-minute proof run 20260917T215646Z: 8 disturbances (3 restarts, 5 pauses),
# no wedge, 9,685 heal entries applied, every flow delivering at every good
# sample. One residual, known and filed: #4287 -- a restarted validator's
# re-seeded cache builds heal answers whose continuation receipt does not
# chain, so for a few minutes after each restart requests to that node fail
# (115 on the proof run) and one flow can go red briefly (BVN2->Directory,
# ~72s behind, ~1 min). Expect that after each restart here; a flow red for
# longer than the wedge threshold is something else.
DURATION=24h
TPS=100
CHAOS=on

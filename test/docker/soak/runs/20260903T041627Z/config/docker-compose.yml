# Docker Compose for 8-Node DAG-BFT Network
# 2 BVNs × 4 validators each
#
# Cut from 3 BVNs to 2 on 2026-08-25: chasing 1000 tx/s on a single 24-core
# host, 12 dual-engine validators left too little CPU per node, and every
# rate above ~60 tx/s collapsed. The topology is still a real multi-partition
# network — DN + BVN1 + BVN2 — so cross-partition synthetics and anchors are
# still exercised in both directions. Ports are 26660..26667.
#
# ⚠️  CRITICAL: Bootstrap server is REQUIRED - do not remove or disable it!
# ⚠️  See README-DAGBFT.md for complete documentation
#
# Usage:
#   docker compose -f test/docker/docker-compose.yml build
#   docker compose -f test/docker/docker-compose.yml up -d
#   docker compose -f test/docker/docker-compose.yml logs -f
#   docker compose -f test/docker/docker-compose.yml down -v

# Cap container logs: nodes log heavily (~700 MB/hour each at DAG-BFT block
# rates) and this host's drives must stay under 50% capacity.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "2"

# Per-run diagnostics, off unless the launcher sets them.
#
# ACC_TX_TRACE=1 logs every transaction at each hand-off — accepted by a
# worker, placed in a batch, executed in a block — which is how a transaction
# that is accepted and then never executed gets located (#4132). It is several
# lines per transaction per node, so it is a switch, not a default.
x-node-env: &node-env
  ACC_TX_TRACE: "${ACC_TX_TRACE-}"
  # Footprint ceiling: without it Go's GC lets RSS run to ~2x live heap.
  # The ceiling must cap WASTE, not squeeze the working set: at 1250MiB the
  # 400 tx/s live set (~1.1GB of heap + DAG + caches) left no headroom, the
  # GC ran continuously, blocks stretched to 3s and the run collapsed in 15
  # minutes (20260824T123427Z). It was then raised to 2750MiB to stop the
  # 256MB block caches fighting the GC.
  #
  # MUST STAY BELOW mem_limit. 2750MiB against a 1536m container is not a
  # ceiling at all — the soft limit can never engage, so the kernel OOM
  # killer is the only thing that stops growth, which is a kill instead of a
  # collection. If a run collapses into continuous GC at this ceiling, the
  # fix is to cut the configured caches, NOT to raise the ceiling above the
  # container limit again.
  #
  # 2026-09-02: container 1536m -> 2048m, ceiling 1200MiB -> 1700MiB,
  # keeping the same ~350MiB of the cgroup for stacks, mmap and non-Go
  # allocations. The 1536m/1200MiB pair had the BVN2 nodes pinned ON the
  # ceiling under leveldb at 500 tx/s — 194-264% CPU, scanobject 29% of a
  # 30s profile, healing 0% — and the run died at 11 minutes when BVN1
  # stalled 193s. Two things changed with it: bcdb replaces leveldb's
  # recordCache and buffer pools (~310MB/node), and the bcdb write tally
  # stopped keeping a digest per key (~190MB/node).
  GOMEMLIMIT: "${GOMEMLIMIT-1700MiB}"
  # Execution sharding (#4145). Defaults to 1 = serial, which is what every
  # generated network has silently run since the feature landed — the config
  # plumbing is complete but cmd_init_network never sets it. Set
  # ACC_EXECUTION_SHARDS to sweep it without regenerating genesis.
  ACC_EXECUTION_SHARDS: "${ACC_EXECUTION_SHARDS-}"

services:
  # CRITICAL: Bootstrap server is REQUIRED for peer discovery
  # All validators need this to find each other on the network
  # Key must match the deterministic key generated by init network
  bootstrap:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bootstrap
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    ports:
      # Host port 16653 (not 16593) - accman-managed follower nodes use the
      # 165xx range on the host. In-network peers reach acc-bootstrap:16593
      # via docker DNS regardless of this mapping.
      - "16653:16593"
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':16593 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Initialize network configuration.
  #
  # ⚠️  Guarded by a marker file: compose re-runs this service whenever a
  # dependent is started via `docker compose start/up` — and an unguarded
  # `--reset` regenerates every config and genesis with NEW RANDOM KEYS while
  # the validators keep running on the old ones, silently poisoning the
  # network. (Use `docker start acc-<name>` to restart single nodes.)
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-init
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
      - ../..:/workspace
    working_dir: /workspace
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /root/.accumulate/init-done ]; then
          echo 'network already initialized — skipping (remove the volume to re-init)'
          exit 0
        fi
        accumulated init network test/docker/docker-network.yml --reset --faucet-seed=FAUCET \
          --database=${ACC_STORAGE-leveldb} \
          && touch /root/.accumulate/init-done

  # BVN1 Validators
  bvn1-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-1
      - /root/.accumulate/bvn1-1/accumulate.toml
    ports:
      - "26660:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-2
      - /root/.accumulate/bvn1-2/accumulate.toml
    ports:
      - "26661:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val3
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-3
      - /root/.accumulate/bvn1-3/accumulate.toml
    ports:
      - "26662:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val4
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-4
      - /root/.accumulate/bvn1-4/accumulate.toml
    ports:
      - "26663:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # BVN2 Validators
  bvn2-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-1
      - /root/.accumulate/bvn2-1/accumulate.toml
    ports:
      - "26664:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-2
      - /root/.accumulate/bvn2-2/accumulate.toml
    ports:
      - "26665:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val3
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-3
      - /root/.accumulate/bvn2-3/accumulate.toml
    ports:
      - "26666:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val4
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-4
      - /root/.accumulate/bvn2-4/accumulate.toml
    ports:
      - "26667:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

volumes:
  network-config:

# A one-hour throughput run at 300 tps, no chaos.  Layered on soak.conf with
#   ./soak.sh -c 1h-300tps.conf "why"
#
# 2026-09-17: the first Accumulate run since the measurement disk was trimmed
# (~/infrastructure/disk-trim.md).  Every soak before today shared a drive
# that stalled every fsync on the box for 30-40 s at a time under sustained
# writes, so a knee in an earlier run may be the drive rather than the
# network.  Everything else is the 20260916T182706Z 300-tps run's shape.
DURATION=1h
TPS=300
CHAOS=off

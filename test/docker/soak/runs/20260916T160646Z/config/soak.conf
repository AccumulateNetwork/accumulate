# Soak configuration. Every knob the soak harness takes lives here, with its
# default. A run is launched as
#
#   ./soak.sh "why I am running this"                # this file
#   ./soak.sh -c my.conf "why I am running this"     # this file, then my.conf on top
#
# Whatever ran is frozen into runs/<ts>/config/ (this file, the override, the
# compose file, the network file), so a result stays readable after the tree
# moves on. Values are plain shell assignments; nothing here is read from the
# launching shell's environment.
#
# The storage backend is NOT here: it is the network's, in
# ../docker-network.yml (`database:`), read by `accumulated init network`.

# --- the run ---------------------------------------------------------------
DURATION=12h          # Go-style: 12h, 45m, 300s
TPS=500               # load generator target, transactions per second
CHAOS=off             # on: restart or pause one BVN container on a cadence; off: a throughput/footprint run
LG_BOOTSTRAP=100      # sub-treasuries funded up front (cross-partition traffic); 0 lets streams go quiet
LG_SUBMITTERS=64      # load generator submit workers
LG_CONTROL_PORT=8091  # load generator control API (POST {"tps": N} to change the rate live)

# --- the nodes (passed to docker compose) ----------------------------------
ACC_BLOCK_INTERVAL=1s        # block interval pinned at network init
ACC_MEM_LIMIT=2048m          # container memory limit; GOMEMLIMIT MUST stay below it
GOMEMLIMIT=1700MiB           # Go soft memory ceiling per node process
ACC_EXECUTION_SHARDS=        # empty: the node default
ACC_TX_TRACE=                # 1: log every transaction at each hand-off (very heavy)
COMPOSE_PROJECT_NAME=disoak  # compose project; images are <project>-<service>

# --- induced faults (chaos on) ---------------------------------------------
# The fault model is container disturbance: every CHAOS_MIN + [0, CHAOS_JITTER)
# seconds one BVN container (which also hosts a Directory validator) is
# restarted or paused for 60-180s. That is the WHOLE model. There is no in-band
# message dropping: the DROP_SYN/DROP_ANC knobs that used to sit here named
# hooks no node has ever implemented, and every manifest that recorded them
# recorded fault injection that did not happen (REPORTING-SPEC 1).
# Empty means the duration-scaled default: 480s+240s jitter for runs over
# 30 minutes, 25s+20s for shorter ones. Set explicitly to override. Owned by
# this file, never by the environment.
CHAOS_MIN=
CHAOS_JITTER=

# --- the watches -----------------------------------------------------------
STALL_KILL_SECS=240     # stop the run after this long with no block progress; 0 disables
WEDGE_SECS=120          # dump goroutines/heap/block profiles after this long stalled
PROBE_SAMPLE_EVERY=20   # read-back probe: seconds between sampling a recent entry
PROBE_EVERY=60          # read-back probe: seconds between re-read rounds
MON_INTERVAL=30         # dashboard sampler interval, seconds
STORAGE_STATS_INTERVAL=300
PROFILE_INTERVAL=       # empty: no periodic profiles

# --- odds and ends ---------------------------------------------------------
NO_OPEN=                # 1: do not open the dashboard in the browser (it is always opened otherwise)
KEEP_UP=                # 1: leave the network up after the run
SOAK_FORCE=0            # 1: start even though a soak is already running (never, unless you know why)

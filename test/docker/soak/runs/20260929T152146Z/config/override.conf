# A fresh 72h network with load and the monitor, never stopping on a stall, so
# a deliberate whole-network restart can be made and watched with the log
# capture running across it (Paul, 2026-09-29).
#
#   ./soak.sh -c 72h-watch.conf "why"
DURATION=72h
TPS=1
LG_BOOTSTRAP=100
CHAOS=off
STALL_KILL_SECS=259200  # never stop on a stall; watch it instead

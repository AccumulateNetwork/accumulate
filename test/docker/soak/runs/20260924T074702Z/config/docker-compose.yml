# Docker Compose for the DAG-BFT soak network
# 3 BVNs × 4 validators, plus one follower (#4365), plus bootstrap; and a
# second follower (#4364) that `up` does not start — the chaos walk adds it
#
# The header said "8-Node" and "2 BVNs" long after the network went back to
# three; the shape of record is docker-network.yml, and ../topology.py derives
# everything from it. Ports 26680..26691 are the twelve validators and 26692
# is the follower, allocated in that file's declaration order; 26693 is the
# follower the chaos walk adds (#4364).
#
# Block interval defaults to 1s here (ACC_BLOCK_INTERVAL), not the binary's 3s.
# A soak exists to reach failures, and at 3s/block every failure that needs
# height to appear takes three times as long to arrive: the runs that wedged
# BVN2 took 8 and 23 minutes to show it. Rounds pace at half the interval,
# since Bullshark commits a leader every other round.
#
# Cut from 3 BVNs to 2 on 2026-08-25 (chasing 1000 tx/s on a single 24-core
# host: 12 containers each running two nodes left too little CPU per node,
# and every rate
# above ~60 tx/s collapsed), and back to 3 since. The topology is a real
# multi-partition network — DN + BVN1 + BVN2 + BVN3 — so cross-partition
# synthetics and anchors are exercised in both directions.
#
# 2026-09-13: moved off 26660..26667. This host also runs a mainnet follower
# that binds 127.0.0.1:26660, so publishing on 0.0.0.0:26660 fails to bind and
# takes one validator down with it — silently, since the other seven come up.
# topology.BASE_HOST_PORT must move with this.
#
# ⚠️  CRITICAL: Bootstrap server is REQUIRED - do not remove or disable it!
# ⚠️  See README-DAGBFT.md for complete documentation
#
# Usage:
#   docker compose -f test/docker/docker-compose.yml build
#   docker compose -f test/docker/docker-compose.yml up -d
#   docker compose -f test/docker/docker-compose.yml logs -f
#   docker compose -f test/docker/docker-compose.yml down -v

# Cap container logs: nodes log heavily (~700 MB/hour each at DAG-BFT block
# rates) and this host's drives must stay under 50% capacity.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "2"

# Per-run diagnostics, off unless the launcher sets them.
#
# ACC_TX_TRACE=1 logs every transaction at each hand-off — accepted by a
# worker, placed in a batch, executed in a block — which is how a transaction
# that is accepted and then never executed gets located (#4132). It is several
# lines per transaction per node, so it is a switch, not a default.
x-node-env: &node-env
  ACC_TX_TRACE: "${ACC_TX_TRACE-}"
  # Footprint ceiling: without it Go's GC lets RSS run to ~2x live heap.
  # The ceiling must cap WASTE, not squeeze the working set: at 1250MiB the
  # 400 tx/s live set (~1.1GB of heap + DAG + caches) left no headroom, the
  # GC ran continuously, blocks stretched to 3s and the run collapsed in 15
  # minutes (20260824T123427Z). It was then raised to 2750MiB to stop the
  # 256MB block caches fighting the GC.
  #
  # MUST STAY BELOW mem_limit. 2750MiB against a 1536m container is not a
  # ceiling at all — the soft limit can never engage, so the kernel OOM
  # killer is the only thing that stops growth, which is a kill instead of a
  # collection. If a run collapses into continuous GC at this ceiling, the
  # fix is to cut the configured caches, NOT to raise the ceiling above the
  # container limit again.
  #
  # 2026-09-02: container 1536m -> 2048m, ceiling 1200MiB -> 1700MiB,
  # keeping the same ~350MiB of the cgroup for stacks, mmap and non-Go
  # allocations. The 1536m/1200MiB pair had the BVN2 nodes pinned ON the
  # ceiling under leveldb at 500 tx/s — 194-264% CPU, scanobject 29% of a
  # 30s profile, healing 0% — and the run died at 11 minutes when BVN1
  # stalled 193s. Two things changed with it: bcdb replaces leveldb's
  # recordCache and buffer pools (~310MB/node), and the bcdb write tally
  # stopped keeping a digest per key (~190MB/node).
  GOMEMLIMIT: "${GOMEMLIMIT-1700MiB}"

services:
  # CRITICAL: Bootstrap server is REQUIRED for peer discovery
  # All validators need this to find each other on the network
  # Key must match the deterministic key generated by init network
  bootstrap:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bootstrap
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    ports:
      # Host port 16653 (not 16593) - accman-managed follower nodes use the
      # 165xx range on the host. In-network peers reach acc-bootstrap:16593
      # via docker DNS regardless of this mapping.
      - "16653:16593"
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':16593 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Initialize network configuration.
  #
  # ⚠️  Guarded by a marker file: compose re-runs this service whenever a
  # dependent is started via `docker compose start/up` — and an unguarded
  # `--reset` regenerates every config and genesis with NEW RANDOM KEYS while
  # the validators keep running on the old ones, silently poisoning the
  # network. (Use `docker start acc-<name>` to restart single nodes.)
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-init
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
      - ../..:/workspace
    working_dir: /workspace
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /root/.accumulate/init-done ]; then
          echo 'network already initialized — skipping (remove the volume to re-init)'
          exit 0
        fi
        accumulated init network test/docker/docker-network.yml --reset --faucet-seed=FAUCET \
          --block-interval=${ACC_BLOCK_INTERVAL-1s} \
          && touch /root/.accumulate/init-done

  # BVN1 Validators
  bvn1-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-1
      - /root/.accumulate/bvn1-1/accumulate.toml
    ports:
      - "26680:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-2
      - /root/.accumulate/bvn1-2/accumulate.toml
    ports:
      - "26681:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val3
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-3
      - /root/.accumulate/bvn1-3/accumulate.toml
    ports:
      - "26682:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val4
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-4
      - /root/.accumulate/bvn1-4/accumulate.toml
    ports:
      - "26683:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # BVN2 Validators
  bvn2-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-1
      - /root/.accumulate/bvn2-1/accumulate.toml
    ports:
      - "26684:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-2
      - /root/.accumulate/bvn2-2/accumulate.toml
    ports:
      - "26685:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val3
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-3
      - /root/.accumulate/bvn2-3/accumulate.toml
    ports:
      - "26686:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val4
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-4
      - /root/.accumulate/bvn2-4/accumulate.toml
    ports:
      - "26687:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-1
      - /root/.accumulate/bvn3-1/accumulate.toml
    ports:
      - "26688:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-2
      - /root/.accumulate/bvn3-2/accumulate.toml
    ports:
      - "26689:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val3
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-3
      - /root/.accumulate/bvn3-3/accumulate.toml
    ports:
      - "26690:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val4
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-4
      - /root/.accumulate/bvn3-4/accumulate.toml
    ports:
      - "26691:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # The follower (#4365) — the thirteenth node, and not a validator.
  #
  # Identical to every service above: same image, same limits, same volume,
  # same dependencies. It is a follower because of its ENTRY in
  # docker-network.yml (dnnType/bvnnType: follower), which makes
  # `init network` write its key into the NetworkDefinition as inactive, and
  # the DAG-BFT committee is built from active validators only. Nothing here
  # distinguishes it, and nothing here should: the gate asks whether a node
  # with ordinary wiring and a non-committee key follows the line.
  #
  # The name is what the rest of the harness selects on. `acc-bvn3-fol1`
  # still matches `docker ps --filter name=acc-bvn`, so the per-node memory,
  # disk and heal readers pick it up — and the chaos roster and the load
  # generator's endpoints, which must NOT include it, select validators from
  # ../topology.py instead of that filter. See topology.py's header.
  #
  # Its data directory is bvn3-5: `init network` names directories by a
  # node's position among ALL of its BVN's nodes, not among its validators.
  bvn3-fol1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-fol1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-5
      - /root/.accumulate/bvn3-5/accumulate.toml
    ports:
      - "26692:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # The added follower (#4364) — declared, and NOT started by `up`.
  #
  # The `late-follower` profile keeps it out of `docker compose up -d`, which
  # activates no profile, so a run comes up with the same thirteen nodes as
  # before. soak.sh's chaos walk creates it with `compose create` and starts
  # it by name (add-follower) when CHAOS_FOLLOWERS is on, and stops and
  # removes it (remove-follower); nothing else starts it. It is a fresh
  # container each time: soak.sh deletes its two databases before creating it.
  #
  # Otherwise identical to bvn3-fol1: the same image, limits and volume, the
  # bootstrap for its peers, and docker-network.yml's entry — declared last,
  # so its port is 26693 and no validator's port moved — for its key and
  # role. Its data directory is bvn3-6.
  bvn3-fol2:
    profiles: ["late-follower"]
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-fol2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: ${ACC_MEM_LIMIT-2048m}
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-6
      - /root/.accumulate/bvn3-6/accumulate.toml
    ports:
      - "26693:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

volumes:
  network-config:

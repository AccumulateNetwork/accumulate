# The first real-network proof of the join (#4438): a fresh follower on every
# BVN (acc-bvn1-fol1, acc-bvn2-fol1, acc-bvn3-fol2) added at once to a running
# network under light load, nothing else disturbed.
#
#   ./soak.sh -c 30m-light-join.conf "#4438: fresh follower joins; spine, BPT root and anchor match"
#
# Paul, 2026-09-24: "Get the spine working against the real network. Get the
# BPT and anchor to match the network." So no validator is restarted or
# paused, and the load is light: the question is whether the join matches at
# all, not whether it keeps up with a partition at 100 tps (that is #4442).
#
# The load starts at 1 tps (the load generator refuses 0) so the monitor can be
# shown before any real load; raise it with
#   curl -X POST -d '{"tps": 10}' http://127.0.0.1:8091/control
#
# One add-follower slot about CHAOS_MIN into the run, one remove-follower slot
# later, so each follower has ~10 minutes to join and stay in agreement.
#
# What the run must show, in each added follower's log and chaos.log:
#   the spine validated (the partition's own anchors, quorum-signed)
#   the local BPT root equals a signed anchor's root, and the node is ACTIVE
#   its anchors thereafter equal the network's until it is removed
DURATION=30m
TPS=1
LG_BOOTSTRAP=100
CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=1
FOLLOWER_WINDOW_SECS=30
CHAOS_MIN=600
CHAOS_JITTER=15
STALL_KILL_SECS=90

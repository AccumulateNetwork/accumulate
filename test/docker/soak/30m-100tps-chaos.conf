# Thirty minutes at 100 tps, three BVNs, chaos on a fast cadence: the short
# proof that the day's fixes hold under the fault that broke the last run,
# before the twenty-four hour run earns a relaunch.
#
# ONE RATE, START TO FINISH. Do not touch the loadgen control API.
#
# Under test, on top of the 24h config's list:
#   #4284  healing refuses only when execution lags by more than
#          MaxExecutionLag, the node's one definition; a NotFound while behind
#          is lagging-miss, not a miss. Before this every request was refused
#          and a one-entry hole was permanent.
#   #4283  heal entries counted as applied or not-required.
#
# Chaos every ~3 minutes so the half hour sees six or more events, since the
# clean criterion is no flow red across at least six of them. The fault that
# made both holes on 20260917T203252Z was a PAUSE of one validator (#4286),
# and the harness pauses as well as restarts.
#
# Clean means: delivered advances on every synthetic flow every sample;
# heal requests come back answered / not-yet / lagging-miss, not a lagging
# storm; heal entries applied > 0 after a pause event (healing has never run
# in Docker before -- this is its first real test); staged_proofs refused
# stays 0; no flow red across the events.
DURATION=30m
TPS=100
CHAOS=on
CHAOS_MIN=180
CHAOS_JITTER=60

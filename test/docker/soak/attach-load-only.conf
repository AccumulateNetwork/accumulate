# Attach to the running network (keep its databases and validators) and run
# only the load and the monitor. Followers are started by hand, so a test can
# begin at once instead of waiting a follower cycle (Paul, 2026-09-25).
#
#   ./soak.sh -c attach-load-only.conf "why"
ATTACH=1
COMPOSE_PROJECT_NAME=disoak
DURATION=72h
TPS=10
LG_BOOTSTRAP=100
CHAOS=off
STALL_KILL_SECS=1800  # raised while the BVN stall clock is fixed (run 20260929T005140Z)

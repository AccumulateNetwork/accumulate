# Attach to the 10 tps network that is ALREADY RUNNING and resume the late
# follower cycles against it with new follower code -- 12h-10tps-followers.conf,
# restarted without losing the history (Paul, 2026-10-05: "We should be able
# to stop this test, update it, and restart it without losing 38k blocks").
#
#   ./soak.sh -c attach-10tps-followers.conf "followers on/off against the running history, new follower code"
#
# ATTACH=1: soak.sh requires every validator and the bootstrap running in
# project disoak, never runs down, init or up, rebuilds ONLY the late-follower
# images from this tree, removes late followers left over, starts its own
# load, and at the end (or on a stall) removes the late followers and leaves
# the network running. No validator is disturbed. Every slot the late
# followers (acc-bvn1-fol1, acc-bvn2-fol1, acc-bvn3-fol2) are added together,
# databases cleared, joining a longer history than the last; the next slot
# removes them all.
#
# Judged as 12h-10tps-followers.conf is: every added follower reaches ACTIVE
# and stays there until it is removed; every removal leaves the network alone.
ATTACH=1
COMPOSE_PROJECT_NAME=disoak
DURATION=12h
TPS=10
LG_BOOTSTRAP=100

CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
CHAOS_SKIP_ONE_IN=0
CHAOS_MIN=900
# The first add two minutes in: the network is already making blocks.
CHAOS_FIRST_SECS=120
CHAOS_JITTER=60
FOLLOWER_WINDOW_SECS=30

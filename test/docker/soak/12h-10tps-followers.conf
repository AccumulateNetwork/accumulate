# Twelve hours at 10 tps with the late followers brought on, taken off and
# brought on again for the whole run (Paul, 2026-10-04). No validator is
# disturbed: the followers are the only fault.
#
#   ./soak.sh -c 12h-10tps-followers.conf "12h, 10 tps, followers on/off"
#
# Every slot (CHAOS_MIN + 0-CHAOS_JITTER s) alternates add-follower and
# remove-follower: each add starts every late follower (acc-bvn1-fol1,
# acc-bvn2-fol1, acc-bvn3-fol2) with its databases cleared, joining a longer
# history than the last; the next slot removes them all. At 900 s that is
# ~15 min on, ~15 min off, ~24 add/remove pairs. acc-bvn3-fol1 runs from
# genesis and is never disturbed.
#
# Judged on, over the whole run:
#   - every added follower reaches ACTIVE and matches a validator's root
#     (chaos.log: `ACTIVE`, `first root match`; never `NEVER ACTIVE` or
#     `never matched`);
#   - every removal leaves block cadence and every stream's delivered alone
#     (chaos.log: `unaffected`, never `AFFECTED`);
#   - delivered advances on every synthetic flow, the Directory stays 12 of 12.
#
# ONE RATE, START TO FINISH. Do not touch the loadgen control API.
DURATION=12h
TPS=10

CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
CHAOS_SKIP_ONE_IN=0
CHAOS_MIN=900
CHAOS_JITTER=60

# #4363's Docker proof — a follower added to a RUNNING network, then removed.
#
#   ./soak.sh -c 5m-100tps-add-follower.conf "#4363 Docker proof: add-follower, remove-follower"
#
# 5m-100tps-follower.conf (gate 0, #4365) launched its follower WITH the
# network, from genesis. This one starts a follower the network has never
# seen, against a network that is already running under load: the chaos walk
# performs ONE add-follower and, a slot later, ONE remove-follower (soak.sh,
# CHAOS_FOLLOWERS). No validator is restarted or paused, so every lag the run
# measures has one explanation.
#
# The followers added are every one behind the compose's `late-follower`
# profile — one per BVN since #4438: acc-bvn1-fol1, acc-bvn2-fol1 and
# acc-bvn3-fol2 — so `up` does not start them; each has its
# own key in no committee, peers from the bootstrap, BlockchainDB storage per
# docker-network.yml, its databases cleared before it starts. acc-bvn3-fol1,
# the gate-0 follower, runs from genesis beside it as before.
#
# What the run must show, all in chaos.log:
#
#   each added follower reaches ACTIVE (lines per follower; bvn3 shown)
#       -> `follower acc-bvn3-fol2 ACTIVE (...), Ns after it was added`, from
#          accumulate_node_state on every partition it runs; soakmon's
#          node-state row and nodestate.csv show the same start
#   it computes the network's state
#       -> `follower acc-bvn3-fol2 first root match (source=... block=...)`
#   removing it disturbs nothing
#       -> `follower removal 1, 30s either side: unaffected: ...` — every
#          partition's block cadence and every stream's delivered count,
#          before against after. `AFFECTED` names what moved.
#   a follower that never gets there says so
#       -> `NEVER ACTIVE` / `never matched`, written at the removal.
#
# Each added follower's own log is kept as node-logs-<container>-1.txt: the
# live capture only follows the containers `up` started.

DURATION=5m
TPS=100
LG_BOOTSTRAP=100

CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=1
FOLLOWER_WINDOW_SECS=30

# The add at 75-90s, after the network has settled under load; the removal's
# slot 75-90s later, so the follower has at least 105s (the slot plus the
# 30s reading before the removal) to reach ACTIVE; the after-reading ends by
# about 240s, inside the five minutes. The walk's third slot finds the one
# pair done and does nothing.
CHAOS_MIN=75
CHAOS_JITTER=15

# As in gate 0: a stall in a five-minute run is the run's answer.
STALL_KILL_SECS=90

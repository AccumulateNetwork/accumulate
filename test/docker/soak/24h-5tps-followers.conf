# The 24 h acceptance run for the join (#4559): a fresh network at 5 tps, one
# late follower at a time bootstrapped against the growing history, measured,
# cleared, and the next BVN's follower started, for 24 hours.
#
#   ./soak.sh -c 24h-5tps-followers.conf "#4559: 24 h at 5 tps, followers one at a time"
#
# No node is disturbed (Paul, 2026-10-12: "No chaos even on followers"). The
# CHAOS switches below are only how the follower walk is turned on: with
# FOLLOWER_WALK=on, followerwalk.py replaces the disturbance loop, so nothing
# is paused, restarted or killed; a follower is started, given up to
# FOLLOWER_JOIN_SECS to be ACTIVE on every partition, held FOLLOWER_HOLD_SECS
# under measurement, removed, and the next BVN's follower started.
#
# Recorded per node every sample: mem.csv (RSS, heap, next GC, GC count, CPU
# seconds, goroutines), monitor.csv, hostsample.csv (disk, host CPU); per join
# follower.csv / joinphases.py (BVN, added -> ACTIVE, added -> every section
# loaded, worst behind during the hold); every hour a heap, CPU, goroutine and
# block profile plus metrics from every node (hourly-*/).
#
# Pass (#4559): every join fully loaded within 1 h, none leaves ACTIVE, and
# neither join time nor worst-behind grows across the 24 h.
DURATION=24h
TPS=5
LG_BOOTSTRAP=100

CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
CHAOS_SKIP_ONE_IN=0
CHAOS_MIN=900
# The first add two minutes in: the network is already making blocks.
CHAOS_FIRST_SECS=120
CHAOS_JITTER=60
FOLLOWER_WINDOW_SECS=30
FOLLOWER_WALK=on
FOLLOWER_JOIN_SECS=1800
FOLLOWER_HOLD_SECS=900

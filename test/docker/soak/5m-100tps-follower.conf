# Gate 0 of phase 1 — #4365.
#
# Paul, 2026-09-19: "If followers are a question, phase 1 should launch a
# follower to a 100 tps non-chaos network (not bootstrap it) 5 m. Then work
# bootstrapping. Then work bootstrapping a follower."
#
# Whether a node whose author key is in no committee can follow the DAG-BFT
# line AT ALL is believed, not shown. Every later step of phase 1 — the join
# (#4205), bootstrapping a follower (#4363), the twelve-hour acceptance
# (#4364) — assumes it. This run answers it in five minutes and needs none of
# them: the follower is launched WITH the network, from genesis, alongside
# the twelve validators. It is not bootstrapped into a running one.
#
#   ./soak.sh -c 5m-100tps-follower.conf "gate 0 of phase 1: #4365"
#
# The topology is docker-network.yml's: 3 BVNs x 4 validators + bootstrap,
# plus `acc-bvn3-fol1` as BVN3's fifth node with both engine types
# `follower`. Storage is that file's too (BlockchainDB). Nothing here is read
# from the launching shell.
#
# What the run must show, and where each answer lands:
#
#   it executes every committed block at the network's cadence
#       -> the dashboard's follower row group, live; follower.csv per sample;
#          "behind (blocks, max over the run)" in the manifest. The bound is
#          two blocks (soakmon.BEHIND_BOUND) and the reason is in its
#          docstring: the two readings are not simultaneous.
#   its root equals the anchored root at every block
#       -> follower-report.md, from `Sending an anchor` per (partition,
#          block) in node-logs-live.txt.
#   it votes on nothing and proposes nothing
#       -> the committee sizes every engine logged, no `Validator added`, and
#          no certificate refused for a non-committee author. The two
#          per-validator drop counts are `— not measured` and say why: those
#          lines are slog.Debug with no `module` attribute, so this build
#          emits none of them.
#   it answers requests
#       -> the read-back probe's follower section, reading entries it holds
#          from its own port, never through the router.

DURATION=5m
TPS=100

# Off. This is not a resilience run: the question is whether a follower can
# follow an undisturbed network, and a restart or a pause would put a second
# explanation under every lag the run measures. Adding and removing followers
# under chaos is #4364.
CHAOS=off

# Five minutes is short enough that the loadgen's own bootstrap dominates if
# it is left at the default 100 sub-treasuries. Keep it: the funding spread is
# what makes every cross-partition channel carry traffic, which is what makes
# the follower's anchor stream worth comparing at all.
LG_BOOTSTRAP=100

# A stall in a five-minute run is the run's answer, so let the watchdog end it
# rather than burning the remaining minutes: soak.sh's default of 240s is most
# of this run. 90s is three times the 30s the network needs to settle after
# `up` and still leaves four minutes of evidence.
STALL_KILL_SECS=90

# Attach to the running network with load and the monitor, and do NOT stop on
# a stall: the monitor stays up and shows it (Paul, 2026-09-29: "Where is the
# monitor?" while a delivery stall was being debugged).
#
#   ./soak.sh -c attach-watch.conf "why"
ATTACH=1
COMPOSE_PROJECT_NAME=disoak
DURATION=72h
TPS=10
LG_BOOTSTRAP=100
CHAOS=off
STALL_KILL_SECS=259200  # never stop on a stall; watch it instead

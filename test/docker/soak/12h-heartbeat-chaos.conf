# Twelve hours at a rate three BVNs are known to hold, with chaos on, to
# validate what landed on 2026-09-17.
#
# Two changes are under test. The heartbeat (#4277) makes a partition anchor a
# block whose only content is a received directory anchor, so an idle network
# no longer quiesces and every state-tree root stays provable; the question is
# what that extra anchor volume costs over twelve hours. And the restart fix
# that came with it: a partition now puts back the anchors it produced when it
# starts, which it could not serve at all before. Chaos is the only thing that
# exercises that, which is why it is on.
#
# The rate is 100, not 300 or 500. Three BVNs held 100 for an hour on
# 20260917T161555Z, and a run that dies on the throughput wall says nothing
# about either change. Heals must stay at zero: with the restart fix in place
# a restarted node should be answerable, so a heal means it is not.
DURATION=12h
TPS=100
CHAOS=on

# Attach to the long-lived history network that is ALREADY RUNNING and keep
# joining fresh followers to it (#4438) — 24h-history-joins.conf, restarted
# with new code without losing the history.
#
#   ./soak.sh -c attach-history-joins.conf "#4438: joins against the running history, new follower code"
#
# Paul, 2026-09-25: "stop the current test (but keep the database and the
# validators). Update the code and restart the test." ATTACH=1: soak.sh
# requires every validator and the bootstrap running in project disoak, never
# runs down, init or up, rebuilds ONLY the late-follower images from this
# tree, and at the end (or on a stall) removes the late followers and leaves
# the network running. No validator is disturbed. Every CHAOS_MIN the late
# followers (BVN1, BVN2, BVN3) are added together, databases cleared,
# joining; a slot later they are removed; then added again against a longer
# history.
ATTACH=1
COMPOSE_PROJECT_NAME=disoak
DURATION=24h
TPS=10
LG_BOOTSTRAP=100
CHAOS=on
CHAOS_VALIDATORS=off
CHAOS_FOLLOWERS=on
CHAOS_FOLLOWER_CYCLES=0
FOLLOWER_WINDOW_SECS=30
CHAOS_MIN=3600
CHAOS_JITTER=60
STALL_KILL_SECS=90

# A fresh 72h network with load and monitor only. Followers are added by hand
# so a join can be tested at once rather than on a cycle (Paul, 2026-09-28).
#
#   ./soak.sh -c 72h-load-only.conf "why"
#
# Load starts at 1 tps so the monitor can be shown first; raise it with
#   curl -X POST -d '{"tps": 10}' http://127.0.0.1:8091/control
DURATION=72h
TPS=1
LG_BOOTSTRAP=100
CHAOS=off
STALL_KILL_SECS=90

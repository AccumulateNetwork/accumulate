# Docker Compose for 12-Node DAG-BFT Network
# 3 BVNs × 4 validators each
#
# ⚠️  CRITICAL: Bootstrap server is REQUIRED - do not remove or disable it!
# ⚠️  See README-DAGBFT.md for complete documentation
#
# Usage:
#   docker compose -f test/docker/docker-compose.yml build
#   docker compose -f test/docker/docker-compose.yml up -d
#   docker compose -f test/docker/docker-compose.yml logs -f
#   docker compose -f test/docker/docker-compose.yml down -v

# Cap container logs: nodes log heavily (~700 MB/hour each at DAG-BFT block
# rates) and this host's drives must stay under 50% capacity.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "2"

# Per-run diagnostics, off unless the launcher sets them.
#
# ACC_TX_TRACE=1 logs every transaction at each hand-off — accepted by a
# worker, placed in a batch, executed in a block — which is how a transaction
# that is accepted and then never executed gets located (#4132). It is several
# lines per transaction per node, so it is a switch, not a default.
x-node-env: &node-env
  ACC_TX_TRACE: "${ACC_TX_TRACE-}"
  # Footprint ceiling: without it Go's GC lets RSS run to ~2x live heap.
  # The ceiling must cap WASTE, not squeeze the working set: at 1250MiB the
  # 400 tx/s live set (~1.1GB of heap + DAG + caches) left no headroom, the
  # GC ran continuously, blocks stretched to 3s and the run collapsed in 15
  # minutes (20260824T123427Z). 2GiB caps the old 2x headroom while leaving
  # the working set room to breathe; with ~1GB of reclaimable page cache the
  # container sits ~3GB of its 4GiB limit. Raised to 2750MiB with the 256MB
  # block caches (2x on-heap engines) — the caches are the state-scaling fix
  # and must not fight the GC for room.
  GOMEMLIMIT: "${GOMEMLIMIT-2750MiB}"

services:
  # CRITICAL: Bootstrap server is REQUIRED for peer discovery
  # All validators need this to find each other on the network
  # Key must match the deterministic key generated by init network
  bootstrap:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bootstrap
    logging: *bounded-logging
    environment: *node-env
    mem_limit: 4g
    ports:
      # Host port 16653 (not 16593) - accman-managed follower nodes use the
      # 165xx range on the host. In-network peers reach acc-bootstrap:16593
      # via docker DNS regardless of this mapping.
      - "16653:16593"
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':16593 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Initialize network configuration.
  #
  # ⚠️  Guarded by a marker file: compose re-runs this service whenever a
  # dependent is started via `docker compose start/up` — and an unguarded
  # `--reset` regenerates every config and genesis with NEW RANDOM KEYS while
  # the validators keep running on the old ones, silently poisoning the
  # network. (Use `docker start acc-<name>` to restart single nodes.)
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-init
    logging: *bounded-logging
    environment: *node-env
    volumes:
      - network-config:/root/.accumulate
      - ../..:/workspace
    working_dir: /workspace
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /root/.accumulate/init-done ]; then
          echo 'network already initialized — skipping (remove the volume to re-init)'
          exit 0
        fi
        accumulated init network test/docker/docker-network.yml --reset --faucet-seed=FAUCET \
          && touch /root/.accumulate/init-done

  # BVN1 Validators
  bvn1-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val1
    logging: *bounded-logging
    environment: *node-env
    mem_limit: 4g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-1
      - /root/.accumulate/bvn1-1/accumulate.toml
    ports:
      - "26660:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val2
    logging: *bounded-logging
    environment: *node-env
    mem_limit: 4g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-2
      - /root/.accumulate/bvn1-2/accumulate.toml
    ports:
      - "26661:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val3:
    build:
      context: ../..
      dockerfile: Dockerfile

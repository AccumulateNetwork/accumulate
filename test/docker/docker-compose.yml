# Docker Compose for Load Testing Environment
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# WARNING: This configuration uses DEVNET MODE which is NOT suitable for
# proper load testing or production-like testing!
#
# DEVNET runs all validators in ONE process and does NOT expose proper HTTP APIs.
#
# For real load testing, use docker-compose.distributed.yml instead!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# This configuration runs a full Accumulate network for load testing:
#   - 3 Block Validator Networks (BVN1, BVN2, BVN3)
#   - 4 validators per BVN (12 validator nodes total)
#   - 1 Directory Network (DN) with validators
#   - Configured for comprehensive load testing
#
# Network Architecture:
#   - DN: Coordinates cross-BVN transactions
#   - BVN1, BVN2, BVN3: Process account transactions independently
#   - Each BVN has 4 validators for Byzantine fault tolerance
#
# Memory Management:
#   - Each node limited to 4GB (48GB total for 12 nodes)
#   - Monitor with: docker stats
#   - Adjust mem_limit if nodes OOM
#
# Usage:
#   docker compose -f test/docker/docker-compose.yml build
#   docker compose -f test/docker/docker-compose.yml up
#   docker compose -f test/docker/docker-compose.yml down
#
# View logs:
#   docker compose -f test/docker/docker-compose.yml logs -f
#   docker compose -f test/docker/docker-compose.yml logs -f load-testnet
#
# Access API:
#   curl http://localhost:20080/v3/describe

version: '3.8'

services:
  # Main load testing network - runs all nodes via devnet mode
  load-testnet:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: accumulate-load-testnet
    hostname: load-testnet
    restart: unless-stopped
    mem_limit: 16g
    command:
      - run
      - devnet
      - --bvns=3
      - --validators=4
      - --followers=0
      - --name=LoadTest
      - --port=26656
      - --reset
    environment:
      - ACC_LOG_LEVEL=info
      - ACC_BPT_SHARDING_ENABLED=true
      - ACC_BPT_SHARDING_DEPTH=4
    ports:
      # API ports for each BVN + DN (mapped to 20000+ range)
      - "20080:8080"    # BVN0 API
      - "20081:8081"    # BVN1 API
      - "20082:8082"    # BVN2 API
      - "20083:8083"    # DN API
      # P2P ports
      - "20656-20670:26656-26670"
      # Prometheus metrics
      - "20660-20674:26660-26674"
    volumes:
      - load-testnet-data:/root/.accumulate
    networks:
      - load-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/describe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  load-testnet-data:
    driver: local

networks:
  load-test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Docker Compose for 12-Node DAG-BFT Network
# 3 BVNs × 4 validators each
#
# ⚠️  CRITICAL: Bootstrap server is REQUIRED - do not remove or disable it!
# ⚠️  See README-DAGBFT.md for complete documentation
#
# Usage:
#   docker compose -f test/docker/docker-compose.yml build
#   docker compose -f test/docker/docker-compose.yml up -d
#   docker compose -f test/docker/docker-compose.yml logs -f
#   docker compose -f test/docker/docker-compose.yml down -v

services:
  # CRITICAL: Bootstrap server is REQUIRED for peer discovery
  # All validators need this to find each other on the network
  # Key must match the deterministic key generated by init network
  bootstrap:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bootstrap
    mem_limit: 1g
    ports:
      - "16593:16593"
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':16593 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Initialize network configuration
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-init
    volumes:
      - network-config:/root/.accumulate
      - ../..:/workspace
    working_dir: /workspace
    command:
      - init
      - network
      - test/docker/docker-network.yml
      - --reset
      - --faucet-seed=FAUCET

  # BVN1 Validators
  bvn1-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val1
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-1
      - /root/.accumulate/bvn1-1/accumulate.toml
    ports:
      - "26660:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val2
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-2
      - /root/.accumulate/bvn1-2/accumulate.toml
    ports:
      - "26661:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val3
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-3
      - /root/.accumulate/bvn1-3/accumulate.toml
    ports:
      - "26662:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val4
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-4
      - /root/.accumulate/bvn1-4/accumulate.toml
    ports:
      - "26663:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # BVN2 Validators
  bvn2-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val1
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-1
      - /root/.accumulate/bvn2-1/accumulate.toml
    ports:
      - "26664:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val2
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-2
      - /root/.accumulate/bvn2-2/accumulate.toml
    ports:
      - "26665:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val3
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-3
      - /root/.accumulate/bvn2-3/accumulate.toml
    ports:
      - "26666:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val4
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-4
      - /root/.accumulate/bvn2-4/accumulate.toml
    ports:
      - "26667:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # BVN3 Validators
  bvn3-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val1
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-1
      - /root/.accumulate/bvn3-1/accumulate.toml
    ports:
      - "26668:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val2
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-2
      - /root/.accumulate/bvn3-2/accumulate.toml
    ports:
      - "26669:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val3
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-3
      - /root/.accumulate/bvn3-3/accumulate.toml
    ports:
      - "26670:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val4
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-4
      - /root/.accumulate/bvn3-4/accumulate.toml
    ports:
      - "26671:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # Per-node monitoring (collects CPU, memory, and database metrics)
  monitoring:
    image: docker:latest
    container_name: acc-monitoring
    volumes:
      - network-config:/root/.accumulate:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring.py:/monitoring.py:ro
      - /tmp:/tmp  # Mount host /tmp to write CSV files
    working_dir: /
    entrypoint: /bin/sh
    command:
      - -c
      - "apk add --no-cache python3 && python3 /monitoring.py"
    depends_on:
      - bvn1-val1
      - bvn1-val2
      - bvn1-val3
      - bvn1-val4
      - bvn2-val1
      - bvn2-val2
      - bvn2-val3
      - bvn2-val4
      - bvn3-val1
      - bvn3-val2
      - bvn3-val3
      - bvn3-val4
    restart: unless-stopped

volumes:
  network-config:

# Docker Compose for 4-Node DAG-BFT Network
# 1 BVN × 4 validators
#
# ⚠️  CRITICAL: Bootstrap server is REQUIRED - do not remove or disable it!
# ⚠️  See README-DAGBFT.md for complete documentation
#
# Usage:
#   docker compose -f test/docker/docker-compose.yml build
#   docker compose -f test/docker/docker-compose.yml up -d
#   docker compose -f test/docker/docker-compose.yml logs -f
#   docker compose -f test/docker/docker-compose.yml down -v

services:
  # CRITICAL: Bootstrap server is REQUIRED for peer discovery
  # All validators need this to find each other on the network
  # Key must match the deterministic key generated by init network
  bootstrap:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bootstrap
    mem_limit: 1g
    ports:
      - "16593:16593"
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':16593 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Initialize network configuration
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-init
    volumes:
      - network-config:/root/.accumulate
      - ../..:/workspace
    working_dir: /workspace
    command:
      - init
      - network
      - test/docker/docker-network.yml
      - --reset
      - --faucet-seed=FAUCET

  # BVN1 Validators
  bvn1-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val1
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-1
      - /root/.accumulate/bvn1-1/accumulate.toml
    ports:
      - "26660:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started


  # BVN1 Validator 2
  bvn1-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val2
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-2
      - /root/.accumulate/bvn1-2/accumulate.toml
    ports:
      - "26661:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started


  # BVN1 Validator 3
  bvn1-val3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val3
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-3
      - /root/.accumulate/bvn1-3/accumulate.toml
    ports:
      - "26662:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  # BVN1 Validator 4
  bvn1-val4:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val4
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-4
      - /root/.accumulate/bvn1-4/accumulate.toml
    ports:
      - "26663:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started


volumes:
  network-config:

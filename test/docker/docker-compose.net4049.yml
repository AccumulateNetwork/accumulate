# 3 BVN x 4 validator dual-node network for validating #4049 (boot without the
# genesis snapshot). Every node is a dual node (DN validator + its BVN's
# validator): 12 DN validators, 4 per BVN. Static peering (no broker at v1.4.3).
#
#   docker compose -p acc49 -f test/docker/docker-compose.net4049.yml up -d --build
#   docker compose -p acc49 -f test/docker/docker-compose.net4049.yml down -v
#
# Node API on the host: 127.0.0.1:27700 .. 27711

x-build: &build
  context: ../..
  dockerfile: Dockerfile
  args:
    TAGS: production,mainnet
    GIT_DESCRIBE: ${GIT_DESCRIBE:-4049}
    GIT_COMMIT: ${GIT_COMMIT:-}

x-node: &node
  build: *build
  mem_limit: 2g
  restart: "no"
  volumes: [ "net4049-data:/data" ]
  depends_on:
    init: { condition: service_completed_successfully }

services:
  init:
    build: *build
    container_name: acc49-init
    volumes:
      - net4049-data:/data
      - ../..:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/accumulated"]
    command: [ "init", "network", "test/docker/network-4049.yml", "-w", "/data", "--reset", "--faucet-seed", "FAUCET" ]

  acc49-bvn1-1: { <<: *node, container_name: acc49-bvn1-1, command: [ "run", "-w", "/data/bvn1-1" ], ports: [ "27700:26660" ] }
  acc49-bvn1-2: { <<: *node, container_name: acc49-bvn1-2, command: [ "run", "-w", "/data/bvn1-2" ], ports: [ "27701:26660" ] }
  acc49-bvn1-3: { <<: *node, container_name: acc49-bvn1-3, command: [ "run", "-w", "/data/bvn1-3" ], ports: [ "27702:26660" ] }
  acc49-bvn1-4: { <<: *node, container_name: acc49-bvn1-4, command: [ "run", "-w", "/data/bvn1-4" ], ports: [ "27703:26660" ] }

  acc49-bvn2-1: { <<: *node, container_name: acc49-bvn2-1, command: [ "run", "-w", "/data/bvn2-1" ], ports: [ "27704:26660" ] }
  acc49-bvn2-2: { <<: *node, container_name: acc49-bvn2-2, command: [ "run", "-w", "/data/bvn2-2" ], ports: [ "27705:26660" ] }
  acc49-bvn2-3: { <<: *node, container_name: acc49-bvn2-3, command: [ "run", "-w", "/data/bvn2-3" ], ports: [ "27706:26660" ] }
  acc49-bvn2-4: { <<: *node, container_name: acc49-bvn2-4, command: [ "run", "-w", "/data/bvn2-4" ], ports: [ "27707:26660" ] }

  acc49-bvn3-1: { <<: *node, container_name: acc49-bvn3-1, command: [ "run", "-w", "/data/bvn3-1" ], ports: [ "27708:26660" ] }
  acc49-bvn3-2: { <<: *node, container_name: acc49-bvn3-2, command: [ "run", "-w", "/data/bvn3-2" ], ports: [ "27709:26660" ] }
  acc49-bvn3-3: { <<: *node, container_name: acc49-bvn3-3, command: [ "run", "-w", "/data/bvn3-3" ], ports: [ "27710:26660" ] }
  acc49-bvn3-4: { <<: *node, container_name: acc49-bvn3-4, command: [ "run", "-w", "/data/bvn3-4" ], ports: [ "27711:26660" ] }

volumes:
  net4049-data: {}

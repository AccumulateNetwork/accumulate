# Docker harness driving a MIXED cross-partition workload through a repeatedly
# wedged synthetic stream, proving receiver-pull healing recovers every message
# type (#4064, #4067).
#
#   Every node drops sequence numbers divisible by 16, once each
#   (ACC_DEBUG_DROP_SYNTHETIC=*:%16). Because everything is sequenced, every
#   validator evaluates the same rule and drops the same message — a real wedge
#   with no coordination — and the healer's re-submission of that sequence
#   passes. With enable-synthetic-healing = true, the destination pulls the
#   missing message from the source over real libp2p and the stream recovers.
#
#   Modulo mode rather than the "*:1" that synth-heal uses, so that drops recur
#   throughout a long run instead of firing once per node at the start.
#
#   Note this harness also passes under "*:1": the driver nudges a partition it
#   is blocked on, which supplies the later sequence number receiver-pull
#   healing needs to notice a gap. Without that nudge a stream wedged at its
#   head — with nothing queued behind it — never heals, and the driver's
#   one-at-a-time account bootstrap is exactly that shape. Both specs were
#   verified against this harness.
#
# Each node serves the accumulate JSON-RPC API on :26660 (DN) — the driver talks
# to bvn1's, published on 26670. Driven by run-test.sh.

services:
  # Bootstrap server — required for peer/service discovery (the release
  # lineage's P2P stack depends on it; key matches init's deterministic seed).
  bootstrap:
    image: acc-synthmix:test
    container_name: acc-mx-bootstrap
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped

  # Generate configs, then enable synthetic healing on every node.
  init:
    image: acc-synthmix:test
    container_name: acc-mx-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        accumulated init network /workspace/test/docker/synth-mixed/network.yml --reset --faucet-seed=FAUCET
        for d in /root/.accumulate/bvn*-?; do
          if ! grep -q 'enable-synthetic-healing' "$$d/accumulate.toml"; then
            sed -i 's/  type = "coreValidator"/  type = "coreValidator"\n  enable-synthetic-healing = true\n  enable-anchor-healing = true/' "$$d/accumulate.toml"
          fi
          # Point p2p discovery at the local bootstrap (default is the public
          # mainnet bootstrap servers, unreachable/poisonous inside this net)
          if ! grep -q 'acc-mx-bootstrap' "$$d/accumulate.toml"; then
            sed -i 's|^\[p2p\]|[p2p]\n  bootstrap-peers = ["/dns/acc-mx-bootstrap/tcp/16593/p2p/12D3KooWRq3UGwehqoLWg6wDLJDQHduhUbQZ5UHPXKgkPvvWYfvg"]\n  discovery-mode = "auto-server"\n  enable-peer-tracking = true|' "$$d/accumulate.toml"
          fi
          echo "== $$d ==" && grep -E 'bvn =|enable-.*-healing|bootstrap-peers' "$$d/accumulate.toml"
        done
    volumes:
      - network-config:/root/.accumulate
      - ../../..:/workspace
    working_dir: /workspace

  bvn1:
    image: acc-synthmix:test
    container_name: acc-mx-bvn1
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:%16" # drop every 16th sequence once; recurs through the run
    command: ["-w=/root/.accumulate/bvn1-1", "/root/.accumulate/bvn1-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    ports:
      - "26670:26660" # DN JSON-RPC API
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1b:
    image: acc-synthmix:test
    container_name: acc-mx-bvn1b
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:%16" # drop every 16th sequence once; recurs through the run
    command: ["-w=/root/.accumulate/bvn1-2", "/root/.accumulate/bvn1-2/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2:
    image: acc-synthmix:test
    container_name: acc-mx-bvn2
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:%16" # drop every 16th sequence once; recurs through the run
    command: ["-w=/root/.accumulate/bvn2-1", "/root/.accumulate/bvn2-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    ports:
      - "26770:26760"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2b:
    image: acc-synthmix:test
    container_name: acc-mx-bvn2b
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:%16" # drop every 16th sequence once; recurs through the run
    command: ["-w=/root/.accumulate/bvn2-2", "/root/.accumulate/bvn2-2/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3:
    image: acc-synthmix:test
    container_name: acc-mx-bvn3
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:%16" # drop every 16th sequence once; recurs through the run
    command: ["-w=/root/.accumulate/bvn3-1", "/root/.accumulate/bvn3-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3b:
    image: acc-synthmix:test
    container_name: acc-mx-bvn3b
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:%16" # drop every 16th sequence once; recurs through the run
    command: ["-w=/root/.accumulate/bvn3-2", "/root/.accumulate/bvn3-2/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

volumes:
  network-config:

# Docker harness reproducing a wedged synthetic stream and proving receiver-pull
# healing (#4064).
#
#   The genesis faucet (partition P) sends ACME to a recipient on another
#   partition Q, producing a P->Q synthetic transaction. Every node is told to
#   DROP the first cross-partition synthetic it emits (ACC_DEBUG_DROP_SYNTHETIC=*:1),
#   so the first P->Q synthetic is lost and every later one wedges behind it.
#   With enable-synthetic-healing = true, Q pulls the missing message from P over
#   real libp2p and the stream recovers.
#
# Each node serves the accumulate JSON-RPC API on :26660 (DN) — the driver talks
# to bvn1's. Driven by run-test.sh.

services:
  # Bootstrap server — required for peer/service discovery (the release
  # lineage's P2P stack depends on it; key matches init's deterministic seed).
  bootstrap:
    image: acc-synthheal:test
    container_name: acc-bootstrap
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped

  # Generate configs, then enable synthetic healing on every node.
  init:
    image: acc-synthheal:test
    container_name: acc-sh-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        accumulated init network /workspace/test/docker/synth-heal/soak/network.yml --reset --faucet-seed=FAUCET
        for d in /root/.accumulate/bvn*-?; do
          if ! grep -q 'enable-synthetic-healing' "$$d/accumulate.toml"; then
            sed -i 's/  type = "coreValidator"/  type = "coreValidator"\n  enable-synthetic-healing = true\n  enable-anchor-healing = true/' "$$d/accumulate.toml"
          fi
          # Point p2p discovery at the local bootstrap (default is the public
          # mainnet bootstrap servers, unreachable/poisonous inside this net)
          if ! grep -q 'acc-bootstrap' "$$d/accumulate.toml"; then
            sed -i 's|^\[p2p\]|[p2p]\n  bootstrap-peers = ["/dns/acc-bootstrap/tcp/16593/p2p/12D3KooWRq3UGwehqoLWg6wDLJDQHduhUbQZ5UHPXKgkPvvWYfvg"]\n  discovery-mode = "auto-server"\n  enable-peer-tracking = true|' "$$d/accumulate.toml"
          fi
          # Serve the accumulate Prometheus metrics (heals/drops/flow gauges) on a
          # local port; the monitor docker-execs curl against it, no host publish.
          if ! grep -q '\[instrumentation\]' "$$d/accumulate.toml"; then
            printf '\n[instrumentation]\nlisten = ["/ip4/0.0.0.0/tcp/26670/http"]\n' >> "$$d/accumulate.toml"
          fi
          echo "== $$d ==" && grep -E 'bvn =|enable-.*-healing|bootstrap-peers|instrumentation' "$$d/accumulate.toml"
        done
    volumes:
      - network-config:/root/.accumulate
      - ../../../..:/workspace
    working_dir: /workspace


  s1a:
    image: acc-synthheal:test
    container_name: acc-s1a
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "${DROP_SYN-*:%499+3}"
      ACC_DEBUG_DROP_ANCHOR: "${DROP_ANC-*:%997+3}"
    command: ["-w=/root/.accumulate/bvn1-1", "/root/.accumulate/bvn1-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    ports:
      - "26660:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  s1b:

id: "SynthHealSoak"

# 24h chaos soak network: 3 BVNs x 4 validators (#4064 soak).

bootstrap:
  peerAddress: "acc-bootstrap"
  advertizeAddress: "acc-bootstrap"
  listenAddress: "0.0.0.0"
  basePort: 16593

globals:
  # Kourou, not Jiuquan: collection proofs — and every recovery path that roots a
  # proof at an anchor the destination already holds — are gated on it (#4087). A
  # soak at Jiuquan exercises none of that while looking exactly like one that
  # does, which is the failure mode worth guarding against.
  executorVersion: "v2-kourou"
  oracle:
    price: 10000000
  globals:
    majorBlockSchedule: "0 */12 * * *"

bvns:
  - id: "BVN1"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-s1a"
        advertizeAddress: "acc-s1a"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-s1b"
        advertizeAddress: "acc-s1b"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-s1c"
        advertizeAddress: "acc-s1c"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-s1d"
        advertizeAddress: "acc-s1d"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
  - id: "BVN2"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-s2a"
        advertizeAddress: "acc-s2a"
        basePort: 26656

# Docker harness reproducing a wedged synthetic stream and proving receiver-pull
# healing (#4064).
#
#   The genesis faucet (partition P) sends ACME to a recipient on another
#   partition Q, producing a P->Q synthetic transaction. Every node is told to
#   DROP the first cross-partition synthetic it emits (ACC_DEBUG_DROP_SYNTHETIC=*:1),
#   so the first P->Q synthetic is lost and every later one wedges behind it.
#   With enable-synthetic-healing = true, Q pulls the missing message from P over
#   real libp2p and the stream recovers.
#
# Each node serves the accumulate JSON-RPC API on :26660 (DN) — the driver talks
# to bvn1's. Driven by run-test.sh.

services:
  # Generate configs, then enable synthetic healing on every node.
  init:
    image: acc-synthheal:test
    container_name: acc-sh-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        accumulated init network /workspace/test/docker/synth-heal/network.yml --reset --faucet-seed=FAUCET
        for d in /root/.accumulate/bvn*-1; do
          if ! grep -q 'enable-synthetic-healing' "$$d/accumulate.toml"; then
            sed -i 's/  type = "coreValidator"/  type = "coreValidator"\n  enable-synthetic-healing = true/' "$$d/accumulate.toml"
          fi
          echo "== $$d ==" && grep -E 'bvn =|enable-synthetic-healing' "$$d/accumulate.toml"
        done
    volumes:
      - network-config:/root/.accumulate
      - ../../..:/workspace
    working_dir: /workspace

  bvn1:
    image: acc-synthheal:test
    container_name: acc-bvn1
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:1" # drop the first cross-partition synthetic this node emits
    command: ["-w=/root/.accumulate/bvn1-1", "/root/.accumulate/bvn1-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    ports:
      - "26660:26660" # DN JSON-RPC API
    depends_on:
      init:
        condition: service_completed_successfully

  bvn2:
    image: acc-synthheal:test
    container_name: acc-bvn2
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:1"
    command: ["-w=/root/.accumulate/bvn2-1", "/root/.accumulate/bvn2-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    ports:
      - "26760:26760"
    depends_on:
      init:
        condition: service_completed_successfully

  bvn3:
    image: acc-synthheal:test
    container_name: acc-bvn3
    mem_limit: 2g
    environment:
      ACC_DEBUG_DROP_SYNTHETIC: "*:1"
    command: ["-w=/root/.accumulate/bvn3-1", "/root/.accumulate/bvn3-1/accumulate.toml"]
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  network-config:

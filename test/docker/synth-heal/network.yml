id: "SynthHealTest"

# Minimal network to reproduce and heal a wedged synthetic stream (#4064).
# Two nodes, each running the Directory plus one BVN. A cross-partition token
# send (BVN1 -> BVN2) produces a synthetic transaction; the test drops the first
# one to wedge the stream, then verifies receiver-pull healing recovers it.

bootstrap:
  peerAddress: "acc-bootstrap"
  advertizeAddress: "acc-bootstrap"
  listenAddress: "0.0.0.0"
  basePort: 16593

globals:
  executorVersion: "v2"
  oracle:
    price: 10000000
  globals:
    majorBlockSchedule: "0 */12 * * *"

bvns:
  - id: "BVN1"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn1"
        advertizeAddress: "acc-bvn1"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn1b"
        advertizeAddress: "acc-bvn1b"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
  - id: "BVN2"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn2"
        advertizeAddress: "acc-bvn2"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn2b"
        advertizeAddress: "acc-bvn2b"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
  - id: "BVN3"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn3"
        advertizeAddress: "acc-bvn3"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-bvn3b"
        advertizeAddress: "acc-bvn3b"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"

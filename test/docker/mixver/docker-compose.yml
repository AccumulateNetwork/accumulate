# Mixed-version interop test: 6 nodes on acc-synthheal:test (new, dcfae6f36) + 6 on acc-mixver-old:1442
# (old, v1.4.4.2), 2-of-each per BVN, genesis at v2-vandenberg (below the Jiuquan
# #4070 gate) so both binaries execute blocks identically. Proves a mixed fleet
# does not break the network. No fault injection (ACC_DEBUG_DROP unset).
#
#   docker compose -f test/docker/mixver/docker-compose.yml up -d
services:
  bootstrap:
    image: acc-synthheal:test
    container_name: acc-bootstrap
    mem_limit: 1g
    entrypoint: ["/bin/accumulated-bootstrap"]
    command: ["--listen","/ip4/0.0.0.0/tcp/16593","--key","626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"]
    restart: unless-stopped

  # Genesis + config generated by the OLD binary (v1.4.4.2) — the deployed
  # version — so the new nodes must run exactly what production produces.
  init:
    image: acc-mixver-old:1442
    container_name: acc-mv-init
    entrypoint: ["sh","-c"]
    command:
      - |
        if [ -f /root/.accumulate/init-done ]; then echo 'already initialized'; exit 0; fi
        accumulated init network /workspace/test/docker/mixver/network.yml --reset --faucet-seed=FAUCET
        for d in /root/.accumulate/bvn*-?; do
          grep -q 'acc-bootstrap' "$$d/accumulate.toml" || sed -i 's|^\[p2p\]|[p2p]\n  bootstrap-peers = ["/dns/acc-bootstrap/tcp/16593/p2p/12D3KooWRq3UGwehqoLWg6wDLJDQHduhUbQZ5UHPXKgkPvvWYfvg"]\n  discovery-mode = "auto-server"\n  enable-peer-tracking = true|' "$$d/accumulate.toml"
          grep -q '\[instrumentation\]' "$$d/accumulate.toml" || printf '\n[instrumentation]\nlisten = ["/ip4/0.0.0.0/tcp/26670/http"]\n' >> "$$d/accumulate.toml"
        done
        touch /root/.accumulate/init-done
    volumes:
      - network-config:/root/.accumulate
      - ../../..:/workspace
    working_dir: /workspace

  s1a:
    image: acc-synthheal:test   # NEW
    container_name: acc-s1a
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-1","/root/.accumulate/bvn1-1/accumulate.toml"]
    ports:
      - "26660:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  s1b:
    image: acc-synthheal:test   # NEW
    container_name: acc-s1b
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-2","/root/.accumulate/bvn1-2/accumulate.toml"]
    ports:
      - "26661:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:
      init: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}

  s1c:
    image: acc-mixver-old:1442   # OLD
    container_name: acc-s1c
    mem_limit: 4g
    restart: unless-stopped
    command: ["-w=/root/.accumulate/bvn1-3","/root/.accumulate/bvn1-3/accumulate.toml"]
    ports:
      - "26662:26660"
    volumes:
      - network-config:/root/.accumulate
    depends_on:

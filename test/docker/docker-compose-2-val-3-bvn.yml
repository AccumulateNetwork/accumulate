version: '3.8'

services:
  # Bootstrap server for peer discovery — uses config generated by init
  bootstrap:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bootstrap-2v-3b
    mem_limit: 1g
    ports:
      - "16593:16593"
    entrypoint: ["/bin/accumulated-bootstrap"]
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/16593
      - --key
      - "626f6f7473747261702d6e6f64652d6b65792d736565642d7631000000000000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':16593 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Initialize network configuration
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-init-2v-3b
    volumes:
      - network-config:/root/.accumulate
      - ../..:/workspace
    working_dir: /workspace
    command:
      - init
      - network
      - test/docker/docker-network-2-val-3-bvn.yml
      - --reset
      - --faucet-seed=FAUCET

  bvn1-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val1-2v-3b
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-1
      - /root/.accumulate/bvn1-1/accumulate.toml
    ports:
      - "26660:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn1-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn1-val2-2v-3b
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn1-2
      - /root/.accumulate/bvn1-2/accumulate.toml
    ports:
      - "26661:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val1-2v-3b
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-1
      - /root/.accumulate/bvn2-1/accumulate.toml
    ports:
      - "26662:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn2-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn2-val2-2v-3b
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn2-2
      - /root/.accumulate/bvn2-2/accumulate.toml
    ports:
      - "26663:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val1-2v-3b
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-1
      - /root/.accumulate/bvn3-1/accumulate.toml
    ports:
      - "26664:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

  bvn3-val2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: acc-bvn3-val2-2v-3b
    mem_limit: 1g
    volumes:
      - network-config:/root/.accumulate
    command:
      - -w=/root/.accumulate/bvn3-2
      - /root/.accumulate/bvn3-2/accumulate.toml
    ports:
      - "26665:26660"
    depends_on:
      init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_started

volumes:
  network-config:

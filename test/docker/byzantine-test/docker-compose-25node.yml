# Docker Compose for 25-Node Byzantine Fault Tolerance Testing
#
# Network Architecture:
#   - 3 Block Validator Networks (BVN0, BVN1, BVN2)
#   - 8 validators per BVN = 24 validators
#   - 1 Directory Network (DN) with 1 validator = 25 total validators
#   - 1 bootstrap node
#
# Byzantine Attack Testing:
#   - Up to 9 validators can be turned malicious (Byzantine)
#   - 16 honest validators out of 25 total
#   - Tests consensus under 36% Byzantine fault (exceeds 33% BFT threshold)
#   - Validates issues #3869 (duplicate vote handling) and #3870 (vote spam protection)
#
# Resource Requirements:
#   - 26 containers @ 2GB each = 52GB minimum
#   - Adjust mem_limit based on available resources
#
# Usage:
#   docker compose -f test/docker/byzantine-test/docker-compose-25node.yml build
#   docker compose -f test/docker/byzantine-test/docker-compose-25node.yml up
#   docker compose -f test/docker/byzantine-test/docker-compose-25node.yml down -v
#
# Run Byzantine Tests:
#   ./test/docker/byzantine-test/run-byzantine-tests.sh

version: '3.8'

x-node-common: &node-common
  build:
    context: ../../..
    dockerfile: Dockerfile
  restart: unless-stopped
  mem_limit: 2g
  networks:
    - byzantine-test-net

x-env-common: &env-common
  ACC_LOG_LEVEL: info

services:
  # ============================================================================
  # Bootstrap Node
  # ============================================================================

  bootstrap:
    <<: *node-common
    container_name: byzantine-bootstrap
    hostname: bootstrap
    environment:
      <<: *env-common
      NODE_TYPE: bootstrap
    command:
      - run
      - devnet
      - --node=0
      - --bvns=3
      - --validators=8
    ports:
      - "26656:26656"
      - "26660:26660"
    volumes:
      - bootstrap-data:/root/.accumulate


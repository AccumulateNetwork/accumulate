id: "ConsensusLoadTest"

# Bootstrap node (libp2p discovery + consensus-peer broker, #4043)
bootstrap:
  peerAddress: "acc-cl-bootstrap"
  advertizeAddress: "acc-cl-bootstrap"
  listenAddress: "0.0.0.0"
  basePort: 16593

globals:
  executorVersion: "v2"
  oracle:
    price: 10000000
  globals:
    majorBlockSchedule: "0 */12 * * *"

# 3 BVNs x 4 validators. Every node is a dual node: a DN validator AND a
# validator of its BVN — so the DN has 12 validators and each BVN has 4.
bvns:
  - id: "BVN1"
    nodes:
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn1-1", advertizeAddress: "acc-cl-bvn1-1", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn1-2", advertizeAddress: "acc-cl-bvn1-2", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn1-3", advertizeAddress: "acc-cl-bvn1-3", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn1-4", advertizeAddress: "acc-cl-bvn1-4", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
  - id: "BVN2"
    nodes:
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn2-1", advertizeAddress: "acc-cl-bvn2-1", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn2-2", advertizeAddress: "acc-cl-bvn2-2", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn2-3", advertizeAddress: "acc-cl-bvn2-3", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn2-4", advertizeAddress: "acc-cl-bvn2-4", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
  - id: "BVN3"
    nodes:
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn3-1", advertizeAddress: "acc-cl-bvn3-1", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn3-2", advertizeAddress: "acc-cl-bvn3-2", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn3-3", advertizeAddress: "acc-cl-bvn3-3", basePort: 26656, dnnType: "validator", bvnnType: "validator" }
      - { listenAddress: "0.0.0.0", peerAddress: "acc-cl-bvn3-4", advertizeAddress: "acc-cl-bvn3-4", basePort: 26656, dnnType: "validator", bvnnType: "validator" }

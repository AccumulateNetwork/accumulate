id: "ConsensusBrokerTest"

# Bootstrap node (libp2p discovery + consensus-peer broker, #4043)
bootstrap:
  peerAddress: "acc-cb-bootstrap"
  advertizeAddress: "acc-cb-bootstrap"
  listenAddress: "0.0.0.0"
  basePort: 16593

globals:
  executorVersion: "v2"
  oracle:
    price: 10000000
  globals:
    majorBlockSchedule: "0 */12 * * *"

# 3 BVNs x 2 validators (dual nodes: each runs DN + its BVN)
bvns:
  - id: "BVN1"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-cb-bvn1-1"
        advertizeAddress: "acc-cb-bvn1-1"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-cb-bvn1-2"
        advertizeAddress: "acc-cb-bvn1-2"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
  - id: "BVN2"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-cb-bvn2-1"
        advertizeAddress: "acc-cb-bvn2-1"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-cb-bvn2-2"
        advertizeAddress: "acc-cb-bvn2-2"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
  - id: "BVN3"
    nodes:
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-cb-bvn3-1"
        advertizeAddress: "acc-cb-bvn3-1"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"
      - listenAddress: "0.0.0.0"
        peerAddress: "acc-cb-bvn3-2"
        advertizeAddress: "acc-cb-bvn3-2"
        basePort: 26656
        dnnType: "validator"
        bvnnType: "validator"

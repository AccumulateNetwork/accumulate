lessons_learned:
  - id: "LESSON-001"
    date: "2025-11-30"
    resolved_date: "2025-11-30"
    title: "CometBFT requires valid commit signatures for non-genesis start"
    problem: |
      When restoring a snapshot at a non-genesis height (e.g., 10,641,161),
      CometBFT panics because it cannot verify the commit signatures.
    error_message: "panic: failed to reconstruct vote set from commit: failed to verify vote with ChainID MainNet.Directory and PubKey PubKeyEd25519{...}: invalid signature"
    root_cause: |
      CometBFT's state sync architecture assumes commits come from Light Client RPC peers.
      Our offline restore scenario has no peers, so the snapshot must be self-contained.
      The Accumulate snapshot format previously included header, consensus params, validators,
      BPT, and records - but NOT the CometBFT commit signatures.
    solution_status: "RESOLVED"
    solution: |
      The fix was already implemented in the codebase:
      1. pkg/types/cometbft/schema.yml has Commit field (lines 35-37)
      2. cmd/create-snap/main.go extracts commit when -blockstore flag is used (lines 177-217)
      3. internal/node/daemon/snapshots.go uses real commit when present (lines 530-543)

      CRITICAL: When creating snapshots, you MUST use the -blockstore flag:
        create-snap -db /path/to/accumulate.db -blockstore /path/to/blockstore.db -output snapshot.snap

      Without -blockstore, the snapshot will NOT contain commit signatures and restore will fail!
    verification: |
      Tested 2025-11-30: Follower started successfully from snapshots created with -blockstore flag.
      Output showed: "Found real commit in snapshot - deserializing"
      No panic occurred. Both DN and BVN initialized at their respective heights.
    affected_files:
      - "pkg/types/cometbft/schema.yml"
      - "cmd/create-snap/main.go"
      - "internal/node/daemon/snapshots.go"
      - "internal/database/snapshot/full.go"

  - id: "LESSON-002"
    date: "2025-11-30"
    title: "Raw database copies are unreliable"
    problem: |
      Directly copying accumulate.db from a validator backup results in
      inconsistent state. The restored node shows appHeight=0 and tries
      to replay from block 2.
    error_message: "appHeight=0, starting replay from block 2"
    root_cause: |
      Database engines (LevelDB, Badger) use write-ahead logs and may have
      data in memory that hasn't been flushed to disk. A raw file copy
      doesn't capture this transient state.
    solution_status: "UNDERSTOOD"
    correct_approach: |
      Always use proper snapshot tools:
      1. create-snap for creating portable snapshots
      2. restore-snapshot for restoring
      Never directly copy .db directories between systems
    affected_files:
      - "cmd/create-snap/main.go"
      - "cmd/accumulated/cmd_snapshot.go"

  - id: "LESSON-003"
    date: "2025-11-30"
    title: "Snapshot format version 2 has 5 sections"
    problem: |
      Understanding the snapshot format is essential for debugging restore issues.
    error_message: "N/A"
    root_cause: "Documentation purposes"
    solution_status: "DOCUMENTED"
    correct_approach: |
      Snapshot version 2 sections:
      - Section 0: Header (metadata)
      - Section 1: Consensus (genesis params, validators, block header)
      - Section 2: BPT (Binary Patricia Tree - Merkle proofs)
      - Section 3: Records (all account records and state)
      - Section 4: Additional data

      Key missing data: CometBFT commit signatures (required for non-genesis restore)
    affected_files:
      - "internal/database/snapshot/full.go"
      - "pkg/types/cometbft/schema.yml"


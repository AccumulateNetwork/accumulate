  - id: "DECISION-002"
    date: "2025-11-30"
    updated: "2025-11-30"
    title: "Snapshots CAN include commit signatures with -blockstore flag"
    decision: |
      Snapshot format now supports commit signatures when created with -blockstore flag.
      This enables offline restore at non-genesis heights.
    rationale: |
      The -blockstore flag extracts commit from the validator's blockstore.db
      and serializes it as protobuf into the Commit field of the consensus section.
    values:
      consensus_section_includes:
        - chain_id
        - consensus_params
        - validators
        - block_header_partial
        - commit_signatures (when -blockstore flag used)
      required_flags:
        - "-blockstore /path/to/blockstore.db"
    DO_NOT:
      - "Do not create production snapshots without the -blockstore flag"
      - "Do not expect old snapshots (without commits) to work for offline restore"
    affected_files:
      - "pkg/types/cometbft/schema.yml"
      - "cmd/create-snap/main.go"
      - "internal/node/daemon/snapshots.go"

  - id: "LESSON-004"
    date: "2025-11-30"
    resolved_date: "2025-11-30"
    title: "State version App must be set to 2 for mainnet"
    problem: |
      Follower restored from snapshot shows: "wrong Block.Header.Version. Expected {11 0}, got {11 2}"
      Blocks from peers are rejected due to version mismatch.
    error_message: "wrong Block.Header.Version. Expected {11 0}, got {11 2}"
    root_cause: |
      CometBFT's MakeGenesisState uses InitStateVersion which has App=0.
      But mainnet blocks have App=2. The state.Version.Consensus.App must be set to 2.
    solution_status: "RESOLVED"
    solution: |
      Added state.Version.Consensus.App = 2 after MakeGenesisState in restore-snapshot.
      See internal/node/daemon/snapshots.go lines 463-467.
    affected_files:
      - "internal/node/daemon/snapshots.go"

  - id: "LESSON-005"
    date: "2025-11-30"
    resolved_date: "2025-11-30"
    title: "LastBlockID mismatch prevents block sync"
    problem: |
      After fixing version, follower shows: "wrong Block.Header.LastBlockID"
      Expected: AppHash, Got: Actual block hash from blockchain
    error_message: "wrong Block.Header.LastBlockID.  Expected 5C59...:1:5C59..., got A465...:1:2B0FE..."
    root_cause: |
      The restore-snapshot code sets state.LastBlockID = AppHash. But the actual blocks
      on the network have LastBlockID pointing to the real block hash at that height,
      which is different from the AppHash.
    solution_status: "RESOLVED"
    solution: |
      Added LastBlockID field to cometbft schema:
      1. pkg/types/cometbft/schema.yml - Added LastBlockID bytes field
      2. cmd/create-snap/main.go - Extract LastBlockID from commit.BlockID
      3. internal/node/daemon/snapshots.go - Use real LastBlockID from snapshot
    verification: |
      Tested 2025-11-30: Node started successfully with correct LastBlockID.
      Output showed: "Using real LastBlockID from snapshot: A465..."
    affected_files:
      - "cmd/create-snap/main.go"
      - "internal/node/daemon/snapshots.go"
      - "pkg/types/cometbft/schema.yml"

  - id: "LESSON-006"
    date: "2025-11-30"
    title: "LastResultsHash mismatch prevents block sync"
    problem: |
      After fixing LastBlockID, follower shows: "wrong Block.Header.LastResultsHash"
      Expected: empty, Got: Hash from blockchain
    error_message: "wrong Block.Header.LastResultsHash.  Expected , got F3E978B5E5CFBA3838CE0EC313DF40EEA1602D4B4E64F5FDF23720A02FF20895"
    root_cause: |
      CometBFT state.LastResultsHash is empty after restore but the network blocks
      have a non-empty LastResultsHash from ABCI execution results of the previous block.
    solution_status: "UNRESOLVED"
    required_fix: |
      The snapshot needs to include LastResultsHash from the blockstore:
      1. Extract LastResultsHash from block header during snapshot creation
      2. Store it in the consensus section
      3. Set state.LastResultsHash during restore
    workaround: |
      No workaround currently. The follower starts but cannot sync blocks.
    affected_files:
      - "cmd/create-snap/main.go"
      - "internal/node/daemon/snapshots.go"
      - "pkg/types/cometbft/schema.yml"


    title: "Snapshot source data for testing"
    decision: |
      The November 17, 2025 validator backup is the authoritative source
      for all snapshot testing and development.
    rationale: |
      This is a complete backup with verified data at known heights.
    values:
      backup_location: "/media/paul/Expansion/databases/validator_backup_20251117/extracted/"
      dn_path: "dnn/"
      bvn_path: "bvnn/"
      dn_height: 10641161
      bvn_height: 10639083
      dn_app_hash: "5C59946BDCA1EED7382E935730B183096DC0D57485298232378864D261758C06"
      bvn_app_hash: "E1D930B82FA252A6F42FAFDF921A21684A12D1F7E4244D6C049D458AF23265E3"
    DO_NOT:

# Follower Deployment Knowledge Base
# This file provides authoritative information for AI assistants working on follower deployment

version: "1.1"
last_updated: "2025-12-01"
topic: "follower-deployment"

# Section 0: Quick Reference
# Essential information for rapid context building
quick_reference:
  what_is_follower: |
    A non-validating node that syncs blockchain state and provides API access.
    Does NOT participate in consensus, does NOT require staking.

  system_requirements:
    cpu: "4+ cores"
    ram: "16GB minimum, 32GB recommended"
    disk: "500GB+ SSD (NVMe recommended)"
    disk_breakdown:
      dn: "~100GB"
      bvn: "~150GB per BVN"
      growth: "~10-20GB/month"
    software:
      - "Go 1.21+"
      - "Linux (Ubuntu 22.04 recommended)"
      - "Docker (optional)"

  build_commands:
    accumulated: "go build -o accumulated ./cmd/accumulated"
    create_snap: "go build -o create-snap ./cmd/create-snap"
    follower_monitor: "go build -o follower-monitor ./tools/follower-monitor"

  ports:
    # Complete port table - AUTHORITATIVE
    dn_cometbft_p2p: 16591
    dn_cometbft_rpc: 16592
    dn_libp2p: 16593
    dn_prometheus: 26660
    dn_api: 16595
    bvn_cometbft_p2p: 16691
    bvn_cometbft_rpc: 16692
    bvn_libp2p: 16693
    bvn_prometheus: 16694
    bvn_api: 16695

  verification_commands:
    check_peers: "curl -s http://localhost:16592/net_info | jq '.result.n_peers'"
    check_sync: "curl -s http://localhost:16592/status | jq '.result.sync_info'"
    check_api: "curl -s http://localhost:16595/v2 -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"status\"}'"

  two_p2p_networks:
    libp2p:
      purpose: "Accumulate protocol peer discovery"
      config_file: "accumulate.toml"
      address_format: "/dns/HOST/tcp/PORT/p2p/PEER_ID"
    cometbft:
      purpose: "Consensus and block sync"
      config_file: "tendermint.toml"
      address_format: "NODE_ID@HOST:PORT"
    important: "BOTH must be configured for follower to sync"


NodeInfo:
  fields:
    - name: PeerID
      type: p2p.PeerID
      marshal-as: union
      zero-value: '""'
    - name: Network
      type: string
    - name: Services
      type: ServiceAddress
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Version
      type: string
    - name: Commit
      type: string
    # Bootstrap advertisement: optional; populated by nodes that went
    # through the minimum-data bootstrap launcher (#3953). Legacy nodes
    # leave this nil — peers treat that as "not advertised" and follow
    # the backwards-compat fallback (legacy nodes are treated as
    # COMPLETE for legacy queries, per #3970).
    - name: BootstrapAdvertisement
      type: BootstrapAdvertisement
      marshal-as: reference
      pointer: true
      optional: true

FindServiceResult:
  fields:
    - name: PeerID
      type: p2p.PeerID
      marshal-as: union
      zero-value: '""'
    - name: Status
      type: KnownPeerStatus
      marshal-as: enum
    - name: Addresses
      type: p2p.Multiaddr
      marshal-as: union
      repeatable: true

ConsensusStatus:
  fields:
    - name: Ok
      type: bool
    - name: LastBlock
      type: LastBlock
      marshal-as: reference
      pointer: true
    - name: Version
      type: string
    - name: Commit
      type: string
    - name: NodeKeyHash
      type: hash
    - name: ValidatorKeyHash
      type: hash
    - name: PartitionID
      type: string
    - name: PartitionType
      type: protocol.PartitionType
      marshal-as: enum
    - name: Peers
      type: ConsensusPeerInfo
      marshal-as: reference
      pointer: true
      repeatable: true

NetworkStatus:
  fields:
    - name: Oracle
      type: protocol.AcmeOracle
      marshal-as: reference
      pointer: true
    - name: Globals
      type: protocol.NetworkGlobals
      marshal-as: reference
      pointer: true
    - name: Network
      type: protocol.NetworkDefinition
      marshal-as: reference
      pointer: true
    - name: Routing
      type: protocol.RoutingTable
      marshal-as: reference
      pointer: true
    - name: ExecutorVersion
      description: is the active executor version
      type: protocol.ExecutorVersion
      marshal-as: enum
      optional: true
    - name: DirectoryHeight
      description: is the height of the directory network
      type: uint
    - name: MajorBlockHeight
      type: uint
    - name: BvnExecutorVersions
      description: is the active executor version of each BVN
      type: protocol.PartitionExecutorVersion
      marshal-as: reference
      pointer: true
      repeatable: true

SnapshotInfo:
  fields:
    - name: Header
      type: snapshot.Header
      marshal-as: reference
      pointer: true
    - name: ConsensusInfo
      type: cometbft.GenesisDoc
      marshal-as: reference
      pointer: true

Metrics:
  fields:
    - name: TPS
      type: float
      keep-empty: true

ResolvedKeyBook:
  description: resolved key book pages at a given block time (#3957, #3973)
  fields:
    - name: Url
      type: url
      pointer: true
    - name: Pages
      type: protocol.KeyPage
      marshal-as: reference
      pointer: true
      repeatable: true

BlockTimeResult:
  description: block time for a transaction or block (#3973)
  fields:
    - name: BlockTime
      type: time
    - name: BlockHeight
      type: uint

Submission:
  fields:
    - name: Status
      type: protocol.TransactionStatus
      marshal-as: reference
      pointer: true
    - name: Success
      description: indicates whether the envelope was successfully submitted
      type: bool
    - name: Message
      description: is the message returned by the consensus engine
      type: string
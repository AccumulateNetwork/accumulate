Receipt:
  fields:
    - type: merkle.Receipt
      marshal-as: reference
    - name: LocalBlock
      type: uvarint
    - name: LocalBlockTime
      type: time
    - name: MajorBlock
      type: uint
    - name: ForHeight
      description: is the minor block this receipt was produced against, which is the last state-changing block at or before the one that was asked for. Zero means the current state. When it is set the receipt terminates at that block's BPT root, which is the StateTreeAnchor its anchor carries, so a holder of that anchor can check the receipt with nothing else (#4361)
      type: uint
      optional: true
    - name: StartsAtMainState
      description: reports that the receipt starts at a plain hash of the account's main state rather than at the account's whole BPT entry. It is only ever set on a historical receipt, and only when the node retained the account's state receipt for the block; without it a verifier holding the account state cannot recompute the receipt's starting point
      type: bool
      optional: true
    - name: Complete
      description: reports that the receipt terminates at a directory root, so there is no second call to make. A BPT is a tree of current state, so an account proof is built against the current BPT and its root reaches the directory only after an anchor round trip, except on the directory itself where it is already local
      type: bool
      optional: true
    - name: Partition
      description: names whose BPT root the receipt terminates at when it is not complete, so a caller knows what to bind against
      type: string
      optional: true

SightedStream:
  description: is how far one inbound stream of a sequence ledger has been sighted. It is derived from staging and is never stored, so it travels BESIDE the account body and never in it - the body must hash to the leaf the receipt served with it proves (#4295)
  fields:
    - name: Source
      description: is the partition the stream comes from
      type: url
      pointer: true
    - name: Received
      description: is the highest sequence number sighted on the stream, which is what every operator surface means by "received"
      type: uint
      keep-empty: true

LastBlock:
  fields:
    - name: Height
      type: int
    - name: Time
      type: time
    - name: ChainRoot
      type: hash
    - name: StateRoot
      type: hash
    - name: DirectoryAnchorHeight
      type: uint


ConsensusPeerInfo:
  fields:
    - name: NodeID
      type: string
    - name: Host
      type: string
    - name: Port
      type: uint

# BptLeafSummary is one BPT leaf: the account-key hash, its value hash, and the
# account URL. The URL is what a pulling node needs to ask for the account;
# without it the puller would have to keep its own key-hash to URL map.
BptLeafSummary:
  fields:
    - name: KeyHash
      type: hash
    - name: ValueHash
      type: hash
    - name: Account
      type: url
      pointer: true

ServiceAddress:
  incomparable: true
  fields:
    - name: Type
      type: ServiceType
      marshal-as-type: uint
    - name: Argument
      type: string
      optional: true

# Spine records (#4058 / AIP-59). Defined here so a public proof service can
# return them; internal/api/private aliases these, so node-to-node callers and
# the fastsync walker are unaffected.
# MajorHeaderRecord is one entry of a MajorHeaderRange response (#4058): a
# major block's index entry plus the quorum-signed anchor of the minor block
# that closed it.
MajorHeaderRecord:
  fields:
    - name: Index
      description: is the major block index
      type: uint
    - name: Entry
      description: is the major-block index chain entry
      type: protocol.IndexEntry
      marshal-as: reference
      pointer: true
    - name: Anchor
      description: is the partition's self-anchor for the closing minor block
      type: messaging.SequencedMessage
      marshal-as: reference
      pointer: true
    - name: Signatures
      description: is the archived validator quorum over the anchor
      type: protocol.KeySignature
      marshal-as: union
      repeatable: true
    - name: Updates
      description: is the network-account transactions of this major block's window, proven into the anchor
      type: NetworkUpdateProof
      marshal-as: reference
      pointer: true
      repeatable: true

# NetworkUpdateProof is a network-account transaction (e.g. a validator-set
# change) proven into a spine anchor's root chain anchor (#4058). The receipt
# binds the transaction hash to the RootChainAnchor of the anchor that closes
# the major block, so the update inherits the anchor's quorum trust without
# its own quorum check.
NetworkUpdateProof:
  fields:
    - name: Transaction
      type: protocol.Transaction
      marshal-as: reference
      pointer: true
    - name: Receipt
      type: merkle.Receipt
      marshal-as: reference
      pointer: true

# MinorRootRecord binds a run of minor blocks to the verified spine (#4058):
# the self-anchor covering the end of the run with its archived quorum, the
# window's network-account updates, and a receipt list proving the root chain
# extends the client's last verified root to this anchor's root.
AnchorReceiptRecord:
  fields:
    - name: Receipt
      description: proves the partition's BPT root into a directory root; nil while the anchor is still in flight
      type: merkle.Receipt
      marshal-as: reference
      pointer: true
      optional: true
    - name: Anchored
      description: reports whether the directory has committed the root yet. False is a wait, not a failure, since the anchor carrying it has not arrived
      type: bool
    - name: DirectoryBlock
      description: is the directory block whose root the receipt terminates at, being the block that committed the anchor rather than the current one. The terminus is therefore stable, so the same root queried later returns the same receipt
      type: uint
      optional: true

MinorRootRecord:
  fields:
    - name: Anchor
      description: is the partition's self-anchor covering the end of the run
      type: messaging.SequencedMessage
      marshal-as: reference
      pointer: true
    - name: Signatures
      description: is the archived validator quorum over the anchor
      type: protocol.KeySignature
      marshal-as: union
      repeatable: true
    - name: Updates
      description: is the network-account transactions of the run, proven into the anchor
      type: NetworkUpdateProof
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: RootProof
      description: proves the root chain extends the previously verified root to this anchor's root
      type: merkle.ReceiptList
      marshal-as: reference
      pointer: true

AccountLeaf:
  description: is what an account's BPT leaf commits to besides its main state, directory and pending list, as of the block a historical answer is for (#4361). With the body, the directory and the pending list served beside it, it rebuilds the leaf the answer's receipt proves
  fields:
    - name: Chains
      description: is the head of every chain, in the account's chain order
      type: ChainRecord
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: EventsRoot
      description: is the root of the scheduled-events BPT, for a partition ledger
      type: hash
    - name: LocalDeliveryQueue
      description: is the local delivery queue, for a synthetic ledger
      type: txid
      pointer: true
      repeatable: true
    - name: CascadeDeliveryQueue
      description: is the cascade delivery queue, for a synthetic ledger
      type: txid
      pointer: true
      repeatable: true
    - name: Pending
      description: is what the account holds for each of its pending transactions, in the order of the pending list
      type: PendingTransactionSets
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: BookPending
      description: is what a key page holds for each of its book's pending transactions
      type: PendingTransactionSets
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Events
      description: is a partition ledger's scheduled events, which the leaf commits to through EventsRoot. Set on a current answer (#4399), where the root alone could not be written by the node pulling it
      type: LedgerEvents
      marshal-as: reference
      pointer: true

LedgerEvents:
  description: is what a partition ledger's scheduled-events BPT holds, and the block lists that index it (#4399)
  fields:
    - name: MinorBlocks
      type: uint
      repeatable: true
    - name: MinorVotes
      description: is the authority votes held for each minor block
      type: BlockVotes
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: MajorBlocks
      type: uint
      repeatable: true
    - name: MajorPending
      description: is the pending transactions that expire at each major block
      type: BlockPending
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Expired
      description: is the backlog of expired transactions not yet processed
      type: txid
      pointer: true
      repeatable: true

BlockVotes:
  fields:
    - name: Block
      type: uint
    - name: Votes
      type: protocol.AuthoritySignature
      marshal-as: reference
      pointer: true
      repeatable: true

BlockPending:
  fields:
    - name: Block
      type: uint
    - name: Pending
      type: txid
      pointer: true
      repeatable: true

PendingTransactionSets:
  description: is what an account holds for one pending transaction, as its BPT leaf hashes it
  fields:
    - name: TxID
      type: txid
      pointer: true
    - name: V1Hashes
      description: is the hash of the legacy transaction record and its status, for a transaction stored by executor v1; when set it replaces the transaction ID in the leaf
      type: hash
      repeatable: true
    - name: ValidatorSignatures
      type: protocol.KeySignature
      marshal-as: union
      repeatable: true
    - name: Payments
      description: is the hashes of credit payment messages
      type: hash
      repeatable: true
    - name: Votes
      type: PendingVote
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Signatures
      type: PendingSignature
      marshal-as: reference
      pointer: true
      repeatable: true

PendingVote:
  description: is an authority's vote on a pending transaction. It marshals as the store's vote entry does, and the leaf hashes that encoding
  fields:
    - name: Authority
      type: url
      pointer: true
    - name: Hash
      type: hash

PendingSignature:
  description: is an active signature on a pending transaction. It marshals as the store's signature set entry does, and the leaf hashes that encoding
  fields:
    - name: KeyIndex
      type: uint
      keep-empty: true
    - name: Version
      type: uint
    - name: Path
      type: url
      pointer: true
      repeatable: true
    - name: Hash
      type: hash

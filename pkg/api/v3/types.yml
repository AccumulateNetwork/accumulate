Receipt:
  fields:
    - type: merkle.Receipt
      marshal-as: reference
    - name: LocalBlock
      type: uvarint
    - name: LocalBlockTime
      type: time
    - name: MajorBlock
      type: uint
    - name: Complete
      description: reports that the receipt terminates at a directory root, so there is no second call to make. A BPT is a tree of current state, so an account proof is built against the current BPT and its root reaches the directory only after an anchor round trip, except on the directory itself where it is already local
      type: bool
      optional: true
    - name: Partition
      description: names whose BPT root the receipt terminates at when it is not complete, so a caller knows what to bind against
      type: string
      optional: true

LastBlock:
  fields:
    - name: Height
      type: int
    - name: Time
      type: time
    - name: ChainRoot
      type: hash
    - name: StateRoot
      type: hash
    - name: DirectoryAnchorHeight
      type: uint


RecordRange[T Record]:
  union: { type: record, value: Range }
  fields:
    - name: Records
      type: T
      marshal-as: union
      repeatable: true
    - name: Start
      type: uint
      keep-empty: true
    - name: Total
      type: uint
      keep-empty: true
    - name: LastBlockTime
      type: time
      pointer: true

AccountRecord:
  union: { type: record }
  fields:
    - name: Account
      type: protocol.Account
      marshal-as: union
    - name: Directory
      type: { name: RecordRange, parameters: [{ type: UrlRecord, pointer: true }] }
      marshal-as: reference
      pointer: true
    - name: Pending
      type: { name: RecordRange, parameters: [{ type: TxIDRecord, pointer: true }] }
      marshal-as: reference
      pointer: true
    - name: Receipt
      type: Receipt
      marshal-as: reference
      pointer: true
    - name: LastBlockTime
      type: time
      pointer: true
    - name: Sighted
      description: is how far each of a sequence ledger's inbound streams has been sighted, for an anchor or synthetic ledger and nothing else. It is derived from staging, never stored (#4189), and carried here rather than written into Account - a value synthesised into the body makes the body stop hashing to the leaf Receipt proves, and every proof of that account then fails (#4295)
      type: SightedStream
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: Leaf
      description: is the rest of the account's BPT leaf as of the block a historical answer is for, set only on such an answer (#4361). Directory and Pending on the same answer are that block's, in full
      type: AccountLeaf
      marshal-as: reference
      pointer: true

ChainRecord:
  union: { type: record }
  fields:
    - name: Name
      type: string
    - name: Type
      type: merkle.ChainType
      marshal-as: enum
    - name: Count
      type: uint
    - name: State
      type: bytes
      repeatable: true
    - name: LastBlockTime
      type: time
      pointer: true

    - name: IndexOf
      type: ChainRecord
      pointer: true
      marshal-as: reference

ChainEntryRecord[T Record]:
  union: { type: record }
  fields:
    - name: Account
      description: is the account (omitted if unambiguous)
      type: url
      pointer: true
    - name: Name
      type: string
    - name: Type
      type: merkle.ChainType
      marshal-as: enum
    - name: Index
      type: uint
      keep-empty: true
    - name: Entry
      type: hash
    - name: Value
      type: T
      marshal-as: union
    - name: Receipt
      type: Receipt
      marshal-as: reference
      pointer: true
    - name: State
      type: bytes
      repeatable: true
    - name: LastBlockTime
      type: time
      pointer: true

KeyRecord:
  union: { type: record }
  fields:
    - name: Authority
      type: url
      pointer: true
    - name: Signer
      type: url
      pointer: true
    - name: Version
      type: uint
    - name: Index
      type: uint
    - name: Entry
      type: protocol.KeySpec
      marshal-as: reference
      pointer: true

MessageRecord[T messaging.Message]:
  union: { type: record }
  fields:
    - name: ID
      type: txid
      pointer: true
    - name: Message
      type: T
      marshal-as: union
    - name: Status
      type: errors2.Status
      marshal-as: enum
    - { name: StatusNo, type: uint, virtual: true, non-binary: true }
    - name: Error
      type: errors2.Error
      marshal-as: reference
      pointer: true
    - name: Result
      type: protocol.TransactionResult
      marshal-as: union
    - name: Received
      description: is the block when the transaction was first received
      type: uint
    - name: Produced
      type: { name: RecordRange, parameters: [{ type: TxIDRecord, pointer: true }] }
      marshal-as: reference
      pointer: true
    - name: Cause
      type: { name: RecordRange, parameters: [{ type: TxIDRecord, pointer: true }] }
      marshal-as: reference
      pointer: true

    # For transactions
    - name: Signatures
      type: { name: RecordRange, parameters: [{ type: SignatureSetRecord, pointer: true }] }
      marshal-as: reference
      pointer: true

    # For a signature's record within a transaction's record
    - name: Historical
      type: bool

    # For sequenced messages
    - name: Sequence
      type: messaging.SequencedMessage
      marshal-as: reference
      pointer: true
      optional: true

    # For synthetic messages
    - name: SourceReceipt
      type: merkle.Receipt
      marshal-as: reference
      pointer: true

    # For synthetic messages served as part of a range - a collection proof
    # covering every message of the range (#4048). Set on the last record of
    # the range only.
    - name: SourceReceiptList
      type: merkle.ReceiptList
      marshal-as: reference
      pointer: true
      optional: true
    # For synthetic messages served as part of a range - the Directory block
    # the collection proof is provable under. Set beside SourceReceiptList.
    - name: SourceAnchorBlock
      type: uint
      optional: true
    # For a sequenced message that refers to a transaction (a credit payment,
    # a signature request) - the transaction it refers to, so the requester
    # does not have to query the source's history for it.
    - name: Companion
      type: messaging.Message
      marshal-as: union
      optional: true

    - name: LastBlockTime
      type: time
      pointer: true

SignatureSetRecord:
  union: { type: record }
  fields:
    - name: Account
      type: protocol.Account
      marshal-as: union
    - name: Signatures
      type:
        name: RecordRange
        parameters:
        - type:
            name: MessageRecord
            parameters:
            - type: messaging.Message
          pointer: true
      marshal-as: reference
      pointer: true

MinorBlockRecord:
  union: { type: record }
  fields:
    - name: Index
      type: uint
    - name: Time
      type: time
      pointer: true
    - name: Source
      type: url
      pointer: true
    - name: Entries
      type:
        name: RecordRange
        parameters:
        - type:
            name: ChainEntryRecord
            parameters:
            - type: Record
          pointer: true
      marshal-as: reference
      pointer: true
    - name: Anchored
      type: { name: RecordRange, parameters: [{ type: MinorBlockRecord, pointer: true }] }
      marshal-as: reference
      pointer: true
    - name: LastBlockTime
      type: time
      pointer: true

MajorBlockRecord:
  union: { type: record }
  fields:
    - name: Index
      type: uint
    - name: Time
      type: time
    - name: MinorBlocks
      type: { name: RecordRange, parameters: [{ type: MinorBlockRecord, pointer: true }] }
      marshal-as: reference
      pointer: true
    - name: LastBlockTime
      type: time
      pointer: true

UrlRecord:
  union: { type: record }
  fields:
    - name: Value
      type: url
      pointer: true

TxIDRecord:
  union: { type: record }
  fields:
    - name: Value
      type: txid
      pointer: true

IndexEntryRecord:
  union: { type: record }
  fields:
    - name: Value
      type: protocol.IndexEntry
      marshal-as: reference
      pointer: true

BptPageRecord:
  union: { type: record }
  description: is one page of a BPT enumeration; the entries are in BPT key order and BptRoot is the root they are consistent with
  fields:
    - name: Entries
      type: BptLeafSummary
      marshal-as: reference
      pointer: true
      repeatable: true
    - name: NextStart
      description: is the key to pass as the next request's StartHash; undefined when Done
      type: hash
    - name: BptRoot
      type: hash
    - name: Done
      description: reports that this page exhausts the BPT
      type: bool

BptBlockRecord:
  union: { type: record }
  description: is one stored block of a BPT; Slots are the non-empty positions eight levels below Prefix, ascending, and hash to Hash by the tree's rule
  fields:
    - name: Prefix
      type: bytes
    - name: Block
      description: is the minor block the answer is as of, after resolution; zero for the current tree
      type: uint
    - name: BptRoot
      description: is the root of the tree the block belongs to
      type: hash
    - name: Hash
      description: is the hash of the node at Prefix; the root's block has Hash equal to BptRoot
      type: hash
    - name: Slots
      type: BptBlockSlot
      marshal-as: reference
      pointer: true
      repeatable: true

ErrorRecord:
  union: { type: record }
  fields:
    - name: Value
      type: errors2.Error
      pointer: true
      marshal-as: reference

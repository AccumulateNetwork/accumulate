DefaultQuery:
  union: { type: query }
  fields:
    - name: IncludeReceipt
      type: ReceiptOptions
      optional: true
      pointer: true
      marshal-as: reference

ChainQuery:
  union: { type: query }
  custom-is-valid: true
  fields:
    - name: Name
      type: string
      optional: true
    - name: Index
      type: uint
      optional: true
      pointer: true
    - name: Entry
      type: bytes
      optional: true
    - name: Range
      type: RangeOptions
      marshal-as: reference
      pointer: true
      optional: true
    - name: IncludeReceipt
      type: ReceiptOptions
      optional: true
      pointer: true
      marshal-as: reference

DataQuery:
  union: { type: query }
  custom-is-valid: true
  fields:
    - name: Index
      type: uint
      optional: true
      pointer: true
    - name: Entry
      type: bytes
      optional: true
    - name: Range
      type: RangeOptions
      marshal-as: reference
      pointer: true
      optional: true

DirectoryQuery:
  union: { type: query }
  fields:
    - name: Range
      type: RangeOptions
      marshal-as: reference
      pointer: true

PendingQuery:
  union: { type: query }
  fields:
    - name: Range
      type: RangeOptions
      marshal-as: reference
      pointer: true

BlockQuery:
  union: { type: query }
  custom-is-valid: true
  fields:
    - name: Minor
      type: uint
      pointer: true
      optional: true
    - name: Major
      type: uint
      pointer: true
      optional: true
    - name: MinorRange
      type: RangeOptions
      marshal-as: reference
      pointer: true
      optional: true
    - name: MajorRange
      type: RangeOptions
      marshal-as: reference
      pointer: true
      optional: true
    - name: EntryRange
      type: RangeOptions
      marshal-as: reference
      pointer: true
      optional: true
    - name: OmitEmpty
      description: omits empty (unrecorded) blocks from the response
      type: bool
      optional: true

BptPageQuery:
  union: { type: query }
  description: asks for one page of the addressed partition's BPT, for a node pulling the state (executor.md, "Sync")
  fields:
    - name: StartHash
      description: is the key the previous page ended at; the all-FF key, or omitted, starts a fresh scan
      type: hash
      optional: true
    - name: Count
      description: is the number of leaves asked for; omitted takes the server's default
      type: uint
      optional: true
    - name: ForHeight
      description: asks for the page as of a named minor block rather than the server's current one, resolving backward to the last state-changing block at or before it. Zero, the default, is the current tree. A block the server retains no BPT history for is refused, never answered with the current tree (#4361)
      type: uint
      optional: true

BptBlockQuery:
  union: { type: query }
  description: asks for one stored block of the addressed partition's BPT -- the positions eight levels below Prefix -- for a node locating where its root differs (executor.md, "Sync", "Two mismatches")
  fields:
    - name: Prefix
      description: is the key bytes above the block; omitted is the root's block. Each further block is asked for under the prefix of the one above it plus the index of a position that answer named as a branch
      type: bytes
      optional: true
    - name: ForHeight
      description: asks for the block as of a named minor block, resolving backward to the last state-changing block at or before it. Zero, the default, is the current tree. A block the server retains no BPT history for is refused (IncompleteChain), and a block whose root the ledger has not recorded yet is NotReady, never answered with another tree
      type: uint
      optional: true

AnchorSearchQuery:
  union: { type: query }
  description: queries {account}#anchor/{hash}
  fields:
    - name: Anchor
      type: bytes
    - name: IncludeReceipt
      type: ReceiptOptions
      optional: true
      pointer: true
      marshal-as: reference

PublicKeySearchQuery:
  union: { type: query }
  fields:
    - name: PublicKey
      type: bytes
    - name: Type
      type: protocol.SignatureType
      marshal-as: enum

PublicKeyHashSearchQuery:
  union: { type: query }
  fields:
    - name: PublicKeyHash
      type: bytes

DelegateSearchQuery:
  union: { type: query }
  fields:
    - name: Delegate
      type: url
      pointer: true

MessageHashSearchQuery:
  union: { type: query }
  fields:
    - name: Hash
      type: hash

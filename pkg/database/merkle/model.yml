- name: Chain
  type: entity
  fields:
  - name: typ
    type: ChainType
  - name: name
    type: string
  - name: markPower
    type: int
  - name: markFreq
    type: int
  - name: markMask
    type: int
  attributes:
  - name: Head
    type: state
    emptyIfMissing: true
    dataType: State
    pointer: true
  - name: States
    type: state
    dataType: State
    pointer: true
    index: getMarkPoints # Indexed by head
    parameters:
    - name: Index
      type: uint
  - name: Tail
    type: state
    emptyIfMissing: true
    dataType: TailChunk
    pointer: true
    index: getTailChunks # Indexed by head
    parameters:
    - name: Index
      type: uint
  # Intermediate holds, for the element added at Index, the (left, right) pair
  # the cascade combined at Height. The cascade computes these once, when the
  # element is added; storing them means a proof reads them rather than
  # rebuilding the Merkle state that held them (database.md, "Proofs are read,
  # not searched"; #4263). Absent for chains written before this record
  # existed, in which case the reader falls back to rebuilding.
  - name: Intermediate
    type: index
    dataType: bytes
    parameters:
    - name: Index
      type: uint
    - name: Height
      type: uint
  - name: ElementIndex
    type: index
    dataType: uint
    parameters: # Not indexed directly
    - name: Hash
      type: bytes
  - name: Element
    type: index
    dataType: bytes
    parameters: # Not indexed directly
    - name: Index
      type: uint

- name: ChainIndex
  type: entity
  fields:
    - name: blockSize
      type: uint

  # Head is empty if missing because a ChainIndex with no head should behave as
  # if the head was empty. However, Block is **not** empty if missing because an
  # empty block (except head) should never exist.

  attributes:
    - name: Head
      type: state
      private: true
      emptyIfMissing: true
      dataType: chainIndexBlock
      pointer: true
    - name: Block
      parameters:
        - name: Level
          type: uint
        - name: Index
          type: uint
      type: state
      private: true
      dataType: chainIndexBlock
      pointer: true
